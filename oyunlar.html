<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zeka Oyunları | Masal &amp; Zeka</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    .room-title { font-size: 24px; font-weight: 900; color: #7e22ce; text-align: center; margin-bottom: 8px; }
    .room-desc { text-align: center; font-size: 15px; color: #64748b; margin-bottom: 20px; font-weight: 600; }
    .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 360px; margin: 0 auto 16px auto; }
    .memory-card { aspect-ratio: 1; background: #e0e7ff; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; box-shadow: 0 4px 0 #c7d2fe; }
    .memory-card.flipped { background: #ffffff; box-shadow: 0 4px 0 #e2e8f0; }
    .memory-card.matched { background: #bbf7d0; box-shadow: 0 4px 0 #86efac; cursor: default; }
    .reset-btn { background: #3b82f6; color: #ffffff; font-family: inherit; font-weight: 800; border: none; padding: 10px 20px; border-radius: 16px; box-shadow: 0 4px 0 #1d4ed8; display: block; margin: 16px auto 0 auto; cursor: pointer; }
    .word-box { font-size: 36px; font-weight: 900; letter-spacing: 10px; color: #ea580c; text-align: center; margin: 20px 0; background: #fff7ed; padding: 16px; border-radius: 20px; }
    .option-row { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .big-btn { min-width: 60px; height: 60px; background: #facc15; border: none; border-radius: 18px; font-size: 24px; font-weight: 900; color: #78350f; box-shadow: 0 4px 0 #eab308; cursor: pointer; font-family: inherit; padding: 0 16px; }
    .shadow-display { font-size: 80px; text-align: center; margin: 15px 0; }
    .shadow-option { font-size: 40px; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; border: 3px solid #cbd5e1; border-radius: 20px; cursor: pointer; }
    .odd-option { background: #eff6ff; border: 3px solid #93c5fd; border-radius: 20px; padding: 14px 20px; font-size: 20px; font-weight: 800; color: #1e3a8a; cursor: pointer; box-shadow: 0 4px 0 #60a5fa; font-family: inherit; }
    .feedback-box { text-align: center; font-weight: 800; font-size: 19px; min-height: 32px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    
    <header class="app-top-bar">
      <a href="index.html" class="app-brand">
        <span style="font-size:24px;">🧩</span>
        <span class="app-logo-text">Zeka Oyunları</span>
      </a>
      <div class="star-counter-badge">
        <span>⭐</span>
        <span id="user-stars-count">0</span>
      </div>
    </header>

    <main id="oyun-liste">
      <div class="welcome-card">
        <h1>Zihnini Güçlendir 🧠✨</h1>
        <p>Oyunları başarıyla bitir ve ekstra yıldızları topla!</p>
      </div>
      <div id="oyun-grid" class="grid-container"></div>
    </main>

    <section id="oyun-odasi" class="detail-box" style="display: none;">
      <button class="back-btn" onclick="kapatOyun()">⬅ Oyunlara Dön</button>
      <h2 id="room-game-title" class="room-title"></h2>
      <p id="room-game-desc" class="room-desc"></p>
      
      <div id="game-playground"></div>
      <div id="game-feedback" class="feedback-box"></div>
    </section>

  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">📖</span>
      <span>Masallar</span>
    </a>
    <a href="tekerlemeler.html" class="nav-item">
      <span class="nav-icon">⚡</span>
      <span>Tekerleme</span>
    </a>
    <a href="oyunlar.html" class="nav-item active">
      <span class="nav-icon">🧩</span>
      <span>Oyunlar</span>
    </a>
    <a href="rozetler.html" class="nav-item">
      <span class="nav-icon">🏆</span>
      <span>Başarılarım</span>
    </a>
  </nav>

  <script src="app.js"></script>
  <script>
    const oyunlar = [
      { id: "hafiza", baslik: "🦁 Hayvan Eşleştirmece", icon: "🦁", bg: "#fef08a", aciklama: "Aynı iki hayvanı bularak tüm kartları aç!" },
      { id: "kelime", baslik: "🔤 Eksik Harfi Tamamla", icon: "🔤", bg: "#fed7aa", aciklama: "Kelimede eksik bırakılan harfi doğru seçenekten bul!" },
      { id: "golge", baslik: "👤 Doğru Eşi/Gölgeyi Bul", icon: "👤", bg: "#e0e7ff", aciklama: "Gördüğün sevimli hayvanın eşini bul!" },
      { id: "farkli", baslik: "❓ Farklı Olanı Bul", icon: "❓", bg: "#bbf7d0", aciklama: "Gruba uymayan farklı nesneyi yakala!" }
    ];

    function listele() {
      const g = document.getElementById('oyun-grid');
      g.innerHTML = '';
      oyunlar.forEach(o => {
        const d = document.createElement('div');
        d.className = 'custom-card';
        d.innerHTML = `
          <div style="height:170px;background:${o.bg};border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:64px;">${o.icon}</div>
          <div class="card-title">${o.baslik}</div>
          <button class="action-btn btn-play" onclick="oyunAc('${o.id}')">OYNA 🎮</button>
        `;
        g.appendChild(d);
      });
    }

    function oyunAc(id) {
      const o = oyunlar.find(x => x.id === id);
      if (!o) return;
      document.getElementById('oyun-liste').style.display = 'none';
      document.getElementById('oyun-odasi').style.display = 'block';
      document.getElementById('room-game-title').innerText = o.baslik;
      document.getElementById('room-game-desc').innerText = o.aciklama;
      document.getElementById('game-feedback').innerText = '';
      window.scrollTo(0, 0);

      const p = document.getElementById('game-playground');
      p.innerHTML = '';
      if (id === 'hafiza') baslatHafiza(p);
      if (id === 'kelime') baslatKelime(p);
      if (id === 'golge') baslatGolge(p);
      if (id === 'farkli') baslatFarkli(p);
    }

    function kapatOyun() {
      document.getElementById('oyun-odasi').style.display = 'none';
      document.getElementById('oyun-liste').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function baslatHafiza(alan) {
      const emojiler = ['🐼', '🦁', '🦉', '🎈', '⭐', '🌙'];
      let acikKartlar = [];
      let eslesen = 0;
      alan.innerHTML = '<div class="memory-grid" id="m-grid"></div><button class="reset-btn" onclick="baslatHafiza(document.getElementById(\'game-playground\'))">Yeniden Karıştır 🔄</button>';
      const grid = document.getElementById('m-grid');
      const kartDizisi = [...emojiler, ...emojiler].sort(() => Math.random() - 0.5);

      kartDizisi.forEach(emoji => {
        const c = document.createElement('div');
        c.className = 'memory-card';
        c.dataset.emoji = emoji;
        c.innerText = '❓';
        c.onclick = () => {
          if (c.classList.contains('flipped') || c.classList.contains('matched') || acikKartlar.length === 2) return;
          c.innerText = emoji;
          c.classList.add('flipped');
          acikKartlar.push(c);

          if (acikKartlar.length === 2) {
            const [k1, k2] = acikKartlar;
            if (k1.dataset.emoji === k2.dataset.emoji) {
              k1.classList.add('matched');
              k2.classList.add('matched');
              acikKartlar = [];
              eslesen += 2;
              if (eslesen === kartDizisi.length) {
                document.getElementById('game-feedback').innerText = '🎉 Harikasın! +1 Yıldız kazandın! ⭐';
                document.getElementById('game-feedback').style.color = '#15803d';
                yildizEkle(1);
              }
            } else {
              setTimeout(() => {
                k1.innerText = '❓';
                k2.innerText = '❓';
                k1.classList.remove('flipped');
                k2.classList.remove('flipped');
                acikKartlar = [];
              }, 700);
            }
          }
        };
        grid.appendChild(c);
      });
    }

    const kelimeler = [
      { soru: "P _ N D A", dogru: "A", sec: ["A", "E", "O"] },
      { soru: "B A L _ N", dogru: "O", sec: ["U", "O", "I"] }
    ];
    let kIndex = 0;
    function baslatKelime(alan) {
      const q = kelimeler[kIndex % kelimeler.length];
      alan.innerHTML = `<div class="word-box">${q.soru}</div><div class="option-row" id="k-opt"></div>`;
      const opt = document.getElementById('k-opt');
      const fb = document.getElementById('game-feedback');
      q.sec.forEach(h => {
        const b = document.createElement('button');
        b.className = 'big-btn';
        b.innerText = h;
        b.onclick = () => {
          if (h === q.dogru) {
            fb.innerText = '🎉 Doğru! +1 Yıldız ⭐';
            fb.style.color = '#15803d';
            yildizEkle(1);
            setTimeout(() => { kIndex++; baslatKelime(alan); fb.innerText = ''; }, 1200);
          } else {
            fb.innerText = '❌ Tekrar dene küçük kaşif!';
            fb.style.color = '#dc2626';
          }
        };
        opt.appendChild(b);
      });
    }

    const golgeler = [
      { asil: "🦁", secenekler: ["🦁", "🐘", "🦒"], dogru: "🦁" },
      { asil: "🐼", secenekler: ["🐵", "🐼", "🐰"], dogru: "🐼" }
    ];
    let gIndex = 0;
    function baslatGolge(alan) {
      const q = golgeler[gIndex % golgeler.length];
      alan.innerHTML = `<div class="shadow-display">${q.asil}</div><p style="text-align:center;font-weight:700;margin-bottom:12px;color:#475569;">Eşini bul!</p><div class="option-row" id="g-opt"></div>`;
      const opt = document.getElementById('g-opt');
      const fb = document.getElementById('game-feedback');
      q.secenekler.forEach(item => {
        const o = document.createElement('div');
        o.className = 'shadow-option';
        o.innerText = item;
        o.onclick = () => {
          if (item === q.dogru) {
            fb.innerText = '🎉 Doğru eşleşti! +1 Yıldız ⭐';
            fb.style.color = '#15803d';
            yildizEkle(1);
            setTimeout(() => { gIndex++; baslatGolge(alan); fb.innerText = ''; }, 1200);
          } else {
            fb.innerText = '❌ Yanlış hayvan!';
            fb.style.color = '#dc2626';
          }
        };
        opt.appendChild(o);
      });
    }

    const farklilar = [
      { soru: "Hangisi meyve değildir?", sec: ["🍎 Elma", "🍌 Muz", "🐱 Kedi"], dogru: "🐱 Kedi" },
      { soru: "Hangisi uçamaz?", sec: ["🦅 Kartal", "🎈 Balon", "🐢 Kaplumbağa"], dogru: "🐢 Kaplumbağa" }
    ];
    let fIndex = 0;
    function baslatFarkli(alan) {
      const q = farklilar[fIndex % farklilar.length];
      alan.innerHTML = `<h3 style="text-align:center;margin:15px 0;font-size:20px;color:#1e3a8a;">${q.soru}</h3><div class="option-row" id="f-opt"></div>`;
      const opt = document.getElementById('f-opt');
      const fb = document.getElementById('game-feedback');
      q.sec.forEach(sec => {
        const b = document.createElement('button');
        b.className = 'odd-option';
        b.innerText = sec;
        b.onclick = () => {
          if (sec === q.dogru) {
            fb.innerText = '🎉 Harika mantık! +1 Yıldız ⭐';
            fb.style.color = '#15803d';
            yildizEkle(1);
            setTimeout(() => { fIndex++; baslatFarkli(alan); fb.innerText = ''; }, 1200);
          } else {
            fb.innerText = '❌ Bir daha düşün!';
            fb.style.color = '#dc2626';
          }
        };
        opt.appendChild(b);
      });
    }

    listele();
  </script>
</body>
</html>
