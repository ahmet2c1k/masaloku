<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zeka Oyunları | Masal &amp; Zeka</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Oyun Kartları Izgarası */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    @media(max-width: 400px) {
      .game-grid { grid-template-columns: 1fr; }
    }

    .back-game-btn {
      background: #f1f5f9;
      color: #334155;
      border: none;
      padding: 10px 18px;
      border-radius: 16px;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 #cbd5e1;
    }

    /* 1. OYUN: WOW TARZI ÇİZGİLİ KELİME ÇARKI */
    .word-game-card {
      background: linear-gradient(180deg, #ffffff 0%, #fff7ed 100%);
      border: 4px solid #fed7aa;
      border-radius: 28px;
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(234, 88, 12, 0.12);
    }
    .word-level-info {
      font-size: 14px;
      font-weight: 900;
      color: #ea580c;
      background: #ffedd5;
      display: inline-block;
      padding: 5px 14px;
      border-radius: 14px;
      margin-bottom: 8px;
    }
    .word-hint {
      font-size: 15px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 14px;
    }
    .word-slots-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }
    .word-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .word-box {
      width: 38px;
      height: 42px;
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 900;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      transition: all 0.25s;
    }
    .word-box.solved {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
      transform: scale(1.06);
    }
    .current-word-display {
      min-height: 42px;
      background: #ffffff;
      border: 3px dashed #fdba74;
      border-radius: 14px;
      display: inline-flex;
      min-width: 180px;
      padding: 0 16px;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      color: #c2410c;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    /* Dairesel Çark ve Çizgi Alanı */
    .wheel-wrapper {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 0 auto 14px auto;
      background: radial-gradient(circle, #ffedd5 55%, #fed7aa 100%);
      border-radius: 50%;
      border: 4px solid #fdba74;
      touch-action: none;
      user-select: none;
    }
    .wheel-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .wheel-letter {
      position: absolute;
      width: 52px;
      height: 52px;
      margin-left: -26px;
      margin-top: -26px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #f97316;
      color: #9a3412;
      font-size: 22px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #ea580c;
      cursor: pointer;
      z-index: 3;
      transition: transform 0.15s, background 0.15s;
    }
    .wheel-letter.selected {
      background: #f97316;
      color: #ffffff;
      transform: scale(1.15);
    }

    .word-controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-word-action {
      padding: 10px 14px;
      border-radius: 14px;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-clear { background: #f1f5f9; color: #475569; box-shadow: 0 3px 0 #cbd5e1; }
    .btn-hint { background: #fef08a; color: #854d0e; box-shadow: 0 3px 0 #eab308; }
    .btn-submit { background: #10b981; color: #ffffff; box-shadow: 0 4px 0 #047857; }

    /* 2. OYUN: HARF AVCISI (5x5 KELİME TABLOSU) */
    .search-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 290px;
      margin: 14px auto;
    }
    .search-cell {
      aspect-ratio: 1;
      background: #ffffff;
      border: 3px solid #c7d2fe;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 900;
      color: #312e81;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 3px 0 #a5b4fc;
    }
    .search-cell.picked {
      background: #818cf8;
      color: #ffffff;
      border-color: #4f46e5;
    }
    .search-cell.found {
      background: #bbf7d0;
      color: #166534;
      border-color: #22c55e;
    }
    .target-tags {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .target-tag {
      background: #e0e7ff;
      color: #3730a3;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 900;
    }
    .target-tag.done {
      background: #dcfce7;
      color: #15803d;
      text-decoration: line-through;
    }

    /* 3. OYUN: HAFIZA KARTLARI */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 320px;
      margin: 0 auto;
    }
    .memory-card {
      aspect-ratio: 1;
      background: #3b82f6;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1d4ed8;
      user-select: none;
    }
    .memory-card.flipped {
      background: #ffffff;
      border: 3px solid #60a5fa;
    }

    /* 4. OYUN: SAYI & MANTIK TRENİ */
    .math-stage {
      background: #f0fdf4;
      border: 3px solid #bbf7d0;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      font-size: 34px;
      letter-spacing: 6px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .math-options {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

      width: 68px;
      height: 6
