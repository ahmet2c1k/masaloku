<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zeka Oyunları | Masal &amp; Zeka</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Oyun Seçim Sekmeleri */
    .game-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .game-tab-btn {
      flex: 1;
      padding: 12px 10px;
      border-radius: 18px;
      border: none;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      background: #f1f5f9;
      color: #64748b;
      transition: all 0.2s;
    }
    .game-tab-btn.active {
      background: #f97316;
      color: #ffffff;
      box-shadow: 0 4px 0 #c2410c;
    }

    /* KELİME ÇARKI OYUN ALANI */
    .word-game-card {
      background: linear-gradient(180deg, #ffffff 0%, #fff7ed 100%);
      border: 4px solid #fed7aa;
      border-radius: 28px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(234, 88, 12, 0.1);
    }
    .word-level-info {
      font-size: 14px;
      font-weight: 900;
      color: #ea580c;
      background: #ffedd5;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 14px;
      margin-bottom: 12px;
    }
    .word-hint {
      font-size: 16px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 16px;
    }

    /* Bulunacak Kelime Yuvaları */
    .word-slots-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }
    .word-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .word-box {
      width: 42px;
      height: 46px;
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: 12px;
      font-size: 22px;
      font-weight: 900;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    .word-box.solved {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
      transform: scale(1.05);
    }

    /* Aktif Yazılan Harf Giriş Şeridi */
    .current-word-display {
      min-height: 48px;
      background: #ffffff;
      border: 3px dashed #fdba74;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #c2410c;
      letter-spacing: 4px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    /* Harf Çarkı / Butonları */
    .letters-wheel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
      max-width: 280px;
      margin-left: auto;
      margin-right: auto;
    }
    .letter-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 4px 0 #9a3412;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: manipulation;
    }
    .letter-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #9a3412;
    }

    /* Aksiyon Butonları */
    .word-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .btn-word-action {
      padding: 10px 18px;
      border-radius: 16px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-clear {
      background: #f1f5f9;
      color: #64748b;
      box-shadow: 0 3px 0 #cbd5e1;
    }
    .btn-submit {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 4px 0 #047857;
    }
    .btn-submit:active { transform: translateY(2px); box-shadow: 0 2px 0 #047857; }

    /* Hafıza Oyunu (Eski Oyun) Alanı */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 340px;
      margin: 0 auto;
    }
    .memory-card {
      aspect-ratio: 1;
      background: #3b82f6;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1d4ed8;
      user-select: none;
    }
    .memory-card.flipped {
      background: #ffffff;
      border: 3px solid #60a5fa;
      box-shadow: 0 4px 0 #93c5fd;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <header class="app-top-bar">
      <a href="index.html" class="app-brand">
        <span style="font-size:24px;">🧩</span>
        <span class="app-logo-text">Zeka Parkı</span>
      </a>
      <div class="star-counter-badge">
        <span>⭐</span>
        <span id="user-stars-count">0</span>
      </div>
    </header>

    <!-- OYUN DEĞİŞTİRME SEKMELERİ -->
    <div class="game-tabs">
      <button class="game-tab-btn active" id="tab-btn-word" onclick="oyunDegistir('word')">🎡 Kelime Çarkı</button>
      <button class="game-tab-btn" id="tab-btn-memory" onclick="oyunDegistir('memory')">🃏 Hafıza Kartları</button>
    </div>

    <!-- 1. OYUN: TRT / WOW TARZI KELİME BULMACA -->
    <section id="game-word-section" class="word-game-card">
      <div class="word-level-info" id="word-level-text">Bölüm 1</div>
      <div class="word-hint" id="word-hint-text">İpucu: Sevimli dostlarımız</div>

      <!-- Boş Kelime Kutuları -->
      <div class="word-slots-container" id="word-slots"></div>

      <!-- Harflerin Yazıldığı Ekran -->
      <div class="current-word-display" id="word-input-display">...</div>

      <!-- Yuvarlak Harf Butonları -->
      <div class="letters-wheel" id="letters-wheel"></div>

      <!-- Butonlar -->
      <div class="word-controls">
        <button class="btn-word-action btn-clear" onclick="harfTemizle()">❌ Temizle</button>
        <button class="btn-word-action btn-submit" onclick="kelimeKontrolEt()">✨ Bul!</button>
      </div>
    </section>

    <!-- 2. OYUN: HAFIZA KARTLARI -->
    <section id="game-memory-section" style="display:none; text-align:center;">
      <h3 style="margin-bottom:12px; font-weight:900; color:#1e293b;">Eşini Bul! 🃏</h3>
      <div class="memory-grid" id="memory-grid"></div>
      <button class="btn-word-action btn-clear" style="margin-top:16px;" onclick="hafizaBaslat()">Yeniden Başlat 🔄</button>
    </section>

  </div>

  <!-- Alt Mobil Menü -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">📖</span>
      <span>Masallar</span>
    </a>
    <a href="tekerlemeler.html" class="nav-item">
      <span class="nav-icon">⚡</span>
      <span>Tekerleme</span>
    </a>
    <a href="oyunlar.html" class="nav-item active">
      <span class="nav-icon">🧩</span>
      <span>Oyunlar</span>
    </a>
    <a href="rozetler.html" class="nav-item">
      <span class="nav-icon">🏆</span>
      <span>Başarılarım</span>
    </a>
  </nav>

  <script src="app.js"></script>
  <script>
    /* KELİME ÇARKI BÖLÜMLERİ */
    const bolumler = [
      {
        bolum: 1,
        ipucu: "🐾 Sevimli Hayvan Dostlarımız",
        harfler: ["K", "E", "D", "İ"],
        hedefler: ["KEDİ", "DİK"]
      },
      {
        bolum: 2,
        ipucu: "🍉 Jojupof'un Dünyası",
        harfler: ["P", "A", "N", "D", "A"],
        hedefler: ["PANDA", "DANA", "ADA"]
      },
      {
        bolum: 3,
        ipucu: "🌳 Doğanın Güzellikleri",
        harfler: ["A", "Ğ", "A", "Ç"],
        hedefler: ["AĞAÇ", "ÇAĞ"]
      },
      {
        bolum: 4,
        ipucu: "📚 Okul ve Masal Dünyası",
        harfler: ["K", "İ", "T", "A", "P"],
        hedefler: ["KİTAP", "PATİK", "TAKİP"]
      }
    ];

    let aktifBolumIndex = 0;
    let yazilanKelime = "";
    let bulunanKelimeler = [];

    function bolumYukle(idx) {
      aktifBolumIndex = idx % bolumler.length;
      const b = bolumler[aktifBolumIndex];
      yazilanKelime = "";
      bulunanKelimeler = [];
      document.getElementById('word-input-display').innerText = "";

      document.getElementById('word-level-text').innerText = `Bölüm ${b.bolum}`;
      document.getElementById('word-hint-text').innerText = `İpucu: ${b.ipucu}`;

      // Slotları Çiz
      const slotContainer = document.getElementById('word-slots');
      slotContainer.innerHTML = '';
      b.hedefler.forEach(kelime => {
        const row = document.createElement('div');
        row.className = 'word-row';
        row.id = `row-${kelime}`;
        for (let i = 0; i < kelime.length; i++) {
          const box = document.createElement('div');
          box.className = 'word-box';
          box.id = `box-${kelime}-${i}`;
          box.innerText = "?";
          row.appendChild(box);
        }
        slotContainer.appendChild(row);
      });

      // Harf Çarkını Çiz
      const wheel = document.getElementById('letters-wheel');
      wheel.innerHTML = '';
      b.harfler.forEach(harf => {
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.innerText = harf;
        btn.onclick = () => harfEkle(harf);
        wheel.appendChild(btn);
      });
    }

    function harfEkle(h) {
      if (yazilanKelime.length < 8) {
        yazilanKelime += h;
        document.getElementById('word-input-display').innerText = yazilanKelime;
      }
    }

    function harfTemizle() {
      yazilanKelime = "";
      document.getElementById('word-input-display').innerText = "";
    }

    function kelimeKontrolEt() {
      const b = bolumler[aktifBolumIndex];
      if (b.hedefler.includes(yazilanKelime)) {
        if (!bulunanKelimeler.includes(yazilanKelime)) {
          bulunanKelimeler.push(yazilanKelime);
          
          // Kutucukları aç
          for (let i = 0; i < yazilanKelime.length; i++) {
            const box = document.getElementById(`box-${yazilanKelime}-${i}`);
            box.innerText = yazilanKelime[i];
            box.classList.add('solved');
          }

          harfTemizle();

          // Bölüm Bitti mi?
          if (bulunanKelimeler.length === b.hedefler.length) {
            yildizEkle(2);
            setTimeout(() => {
              alert('🎉 Muhteşemsin! Tüm kelimeleri buldun ve +2 Yıldız kazandın! ⭐⭐ Jojupof seni alkışlıyor!');
              bolumYukle(aktifBolumIndex + 1);
            }, 400);
          }
        } else {
          alert('Bu kelimeyi zaten buldun! 🌟');
          harfTemizle();
        }
      } else {
        // Hatalı titreşim hissi
        const d = document.getElementById('word-input-display');
        d.style.color = '#ef4444';
        setTimeout(() => {
          d.style.color = '#c2410c';
          harfTemizle();
        }, 500);
      }
    }

    /* SEKME DEĞİŞTİRME */
    function oyunDegistir(tur) {
      document.getElementById('tab-btn-word').classList.toggle('active', tur === 'word');
      document.getElementById('tab-btn-memory').classList.toggle('active', tur === 'memory');
      document.getElementById('game-word-section').style.display = (tur === 'word') ? 'block' : 'none';
      document.getElementById('game-memory-section').style.display = (tur === 'memory') ? 'block' : 'none';
    }

    /* HAFIZA KARTLARI */
    const emojiler = ['🐼', '🦁', '🐸', '🐨', '🦊', '🐰'];
    let acikKartlar = [];
    let kilit = false;

    function hafizaBaslat() {
      const grid = document.getElementById('memory-grid');
      grid.innerHTML = '';
      const deste = [...emojiler, ...emojiler].sort(() => Math.random() - 0.5);

      deste.forEach(emo => {
        const c = document.createElement('div');
        c.className = 'memory-card';
        c.dataset.icon = emo;
        c.innerText = '❓';
        c.onclick = () => kartSec(c);
        grid.appendChild(c);
      });
      acikKartlar = [];
      kilit = false;
    }

    function kartSec(card) {
      if (kilit || card.classList.contains('flipped')) return;
      card.classList.add('flipped');
      card.innerText = card.dataset.icon;
      acikKartlar.push(card);

      if (acikKartlar.length === 2) {
        kilit = true;
        if (acikKartlar[0].dataset.icon === acikKartlar[1].dataset.icon) {
          acikKartlar = [];
          kilit = false;
        } else {
          setTimeout(() => {
            acikKartlar.forEach(c => {
              c.classList.remove('flipped');
              c.innerText = '❓';
            });
            acikKartlar = [];
            kilit = false;
          }, 800);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      bolumYukle(0);
      hafizaBaslat();
    });
  </script>
</body>
</html>
