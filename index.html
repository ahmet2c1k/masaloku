<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masal Vakti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #bbf7d0 0%, #bae6fd 50%, #fef08a 100%);
      background-attachment: fixed;
      font-family: 'Fredoka', cursive, sans-serif;
      color: #1e293b;
      min-height: 100vh;
      padding: 16px 12px 60px 12px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Üst Bar */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .top-btn {
      background: #ffffff;
      border: 3px solid #fde047;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #ea580c;
      box-shadow: 0 4px 0 #facc15;
      cursor: pointer;
      border-style: solid;
    }

    .site-logo {
      font-size: 32px;
      font-weight: 700;
      color: #f97316;
      text-shadow: 2px 2px 0px #ffffff, 4px 4px 0px #fed7aa;
      text-align: center;
    }

    /* Karşılama Alanı */
    .hero-box {
      text-align: center;
      margin-bottom: 24px;
    }

    .hero-box h1 {
      font-size: 26px;
      color: #0f172a;
      line-height: 1.3;
      margin-bottom: 20px;
    }

    /* Kategori Butonları */
    .category-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cat-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 85px;
      padding: 10px 8px;
      border-radius: 20px;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      box-shadow: 0 5px 0 rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .cat-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }

    .cat-icon { font-size: 30px; margin-bottom: 3px; }
    .cat-all { background: #f97316; }
    .cat-1   { background: #f59e0b; }
    .cat-2   { background: #a855f7; }
    .cat-3   { background: #38bdf8; }
    .cat-4   { background: #10b981; }

    /* Masal Kartları Grid */
    .masal-listesi {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .masal-karti {
      background: #ffffff;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      padding: 14px;
      border: 4px solid #ffffff;
    }

    .masal-resim {
      width: 100%;
      height: 220px;
      border-radius: 20px;
      object-fit: cover;
      background: #fed7aa;
      display: block;
    }

    .masal-baslik {
      font-size: 19px;
      font-weight: 700;
      color: #1e293b;
      margin: 14px 0;
      text-align: center;
      line-height: 1.25;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .oku-btn {
      background: #06b6d4;
      color: #ffffff;
      border-radius: 20px;
      padding: 12px;
      text-align: center;
      border: none;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 4px 0 #0891b2;
      cursor: pointer;
      display: block;
      width: 100%;
      margin-top: auto;
    }

    .oku-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0891b2;
    }

    /* Masal Okuma Sayfası (Mod) */
    #okuma-alani {
      display: none;
      background: #ffffff;
      border-radius: 30px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .geri-btn {
      background: #facc15;
      color: #78350f;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 18px;
      border: none;
      font-family: inherit;
      font-size: 16px;
      box-shadow: 0 4px 0 #eab308;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-block;
    }

    #detay-resim {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    #detay-baslik {
      font-size: 28px;
      color: #ea580c;
      text-align: center;
      margin-bottom: 20px;
    }

    #detay-metin {
      font-size: 21px;
      line-height: 1.8;
      color: #334155;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Üst Bar -->
    <header class="top-header">
      <button class="top-btn" onclick="anaSayfayaDon()">🏠 Menü</button>
      <div class="site-logo">Masal Dünyası</div>
      <button class="top-btn" onclick="alert('Sevimli masallardan birini seç ve hemen oku!')">✨ Bilgi</button>
    </header>

    <!-- Ana Sayfa Listeleme Alanı -->
    <main id="ana-sayfa">
      <div class="hero-box">
        <h1>Merhaba Küçük Kitap Kurdu!<br>Bugün Hangi Masalı Okumak İstersin?</h1>
        <div class="category-row">
          <button class="cat-btn cat-all" onclick="kategoriFiltrele('Tümü')">
            <span class="cat-icon">⭐</span><span>Tümü</span>
          </button>
          <button class="cat-btn cat-1" onclick="kategoriFiltrele('Hayvanlar')">
            <span class="cat-icon">🦁</span><span>Hayvanlar</span>
          </button>
          <button class="cat-btn cat-2" onclick="kategoriFiltrele('Sihirli')">
            <span class="cat-icon">🧙‍♂️</span><span>Sihirli</span>
          </button>
          <button class="cat-btn cat-3" onclick="kategoriFiltrele('Uyku')">
            <span class="cat-icon">🌙</span><span>Uyku</span>
          </button>
          <button class="cat-btn cat-4" onclick="kategoriFiltrele('Macera')">
            <span class="cat-icon">🗺️</span><span>Macera</span>
          </button>
        </div>
      </div>

      <div id="masal-grid" class="masal-listesi"></div>
    </main>

    <!-- Masal Okuma Sayfası -->
    <article id="okuma-alani">
      <button class="geri-btn" onclick="anaSayfayaDon()">⬅ Masallara Dön</button>
      <img id="detay-resim" src="" alt="Kapak">
      <h1 id="detay-baslik"></h1>
      <div id="detay-metin"></div>
    </article>

  </div>

  <script>
    // MASALLAR LİSTESİ (Buraya istediğiniz kadar masal ekleyebilirsiniz)
    const masallar = [
      {
        id: 1,
        baslik: "Kayıp Yavru Panda Pomi",
        kategori: "Hayvanlar",
        resim: "https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=600&auto=format&fit=crop&q=80",
        metin: `Bir zamanlar yemyeşil bambu ağaçlarıyla çevrili, minik perilerin uçuştuğu Sihirli Orman'da minik bir panda yaşarmış. Adı Pomi imiş. Pomi, tüyleri pamuk gibi yumuşacık, burnu minik bir kömür tanesi kadar siyah, çok meraklı bir yavruymuş.

Bir akşamüstü gökyüzü turuncuya ve pembeye dönerken, Pomi parıldayan bir ateş böceğinin peşine takılmış. Zıplamış, koşmuş, peşinden yuvarlanmış... Ama durup etrafına baktığında anne ve babasının yanında olmadığını fark etmiş. Orman birden biraz sessiz ve karanlık gelmiş.

Pomi tam burnunu çekip ağlayacakken, ayağının dibinde altın sarısı bir ışık parıldamış. Bu, sihirli bir orman feneriymiş! Pomi minik patisiyle feneri eline almış. Fener sıcacık bir ışık saçmaya başlamış.

Fenerin neşeli ışığını gören sevimli bir baykuş seslenmiş:
— "Korkma küçük Pomi! Kalbindeki merak ve bu fenerin ışıltısı seni ailene götürür. Işığı takip et!"

Pomi fenerini sımsıkı tutarak patikada ilerlemiş. Çok geçmeden annesinin sıcacık kucağına kavuşmuş. Annesi ona sarılmış ve fısıldamış:
— "Karanlık ne kadar büyük olursa olsun, kalbindeki minik bir umut ışığı her zaman yolunu aydınlatır."

Pomi o gece karnını taze bambularla doyurmuş ve tatlı bir uykuya dalmış. 

İyi uykular küçük kitap kurdu! 🌙✨`
      },
      {
        id: 2,
        baslik: "Uçan Renkli Balon",
        kategori: "Macera",
        resim: "https://images.unsplash.com/photo-1507608616759-54f48f0af0ee?w=600&auto=format&fit=crop&q=80",
        metin: `Mavi gökyüzünde rengarenk süzülen bir balon varmış. Üzerinde sarı, kırmızı ve mavi çizgiler ışıldarmış.

Bir gün rüzgar tatlı tatlı esmiş ve balonu bulutların bile üzerine çıkarmış. Balon gökyüzünde şarkı söyleyen neşeli kuşlarla yarışmış, güneşe el sallamış ve gökkuşağının altından kayarak geçmiş.

Akşam olunca yumuşacık bir pamuk bulutun üstüne konmuş ve yıldızların ninnisiyle rüyalara dalmış.`
      },
      {
        id: 3,
        baslik: "Bilge Baykuşun Sırrı",
        kategori: "Sihirli",
        resim: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=80",
        metin: `Koca meşe ağacının en tepe dalında gözlük takan Bilge Baykuş otururmuş. Her gece gökyüzündeki yıldızları sayar, ormandaki minik hayvanlara en güzel uyku hikayelerini anlatırmış.

Bilge Baykuş'un en büyük sırrı neymiş biliyor musun? Kitapları çok sevmesi! Ne zaman canı sıkılsa bir sayfa çevirir, bambaşka dünyalara kanat çırparmış.`
      }
    ];

    // Kartları Ekrana Basma
    function kartlariGoster(liste) {
      const grid = document.getElementById('masal-grid');
      grid.innerHTML = '';

      liste.forEach(masal => {
        const kart = document.createElement('div');
        kart.className = 'masal-karti';
        kart.innerHTML = `
          <img src="${masal.resim}" class="masal-resim" alt="${masal.baslik}">
          <div class="masal-baslik">${masal.baslik}</div>
          <button class="oku-btn" onclick="masalOku(${masal.id})">OKU 📖</button>
        `;
        grid.appendChild(kart);
      });
    }

    // Kategoriye Göre Filtreleme
    function kategoriFiltrele(kategori) {
      if (kategori === 'Tümü') {
        kartlariGoster(masallar);
      } else {
        const filtrelenmis = masallar.filter(m => m.kategori === kategori);
        kartlariGoster(filtrelenmis);
      }
    }

    // Masal Detayını Açma
    function masalOku(id) {
      const masal = masallar.find(m => m.id === id);
      if (!masal) return;

      document.getElementById('detay-resim').src = masal.resim;
      document.getElementById('detay-baslik').innerText = masal.baslik;
      document.getElementById('detay-metin').innerText = masal.metin;

      document.getElementById('ana-sayfa').style.display = 'none';
      document.getElementById('okuma-alani').style.display = 'block';
      window.scrollTo(0, 0);
    }

    // Geri Dön Butonu
    function anaSayfayaDon() {
      document.getElementById('okuma-alani').style.display = 'none';
      document.getElementById('ana-sayfa').style.display = 'block';
      window.scrollTo(0, 0);
    }

    // Sayfa açıldığında masalları yükle
    kartlariGoster(masallar);
  </script>
</body>
</html>
