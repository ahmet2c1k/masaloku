<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masal Dünyası | Masal &amp; Zeka</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <header class="top-header">
      <a href="index.html" class="top-btn">🏠 Ana Sayfa</a>
      <a href="index.html" class="site-logo">Masal &amp; Zeka</a>
      <button class="top-btn" onclick="alert('Sevimli masallardan birini seç ve keyifle oku!')">✨ Bilgi</button>
    </header>

    <!-- Navigasyon Sekmeleri -->
    <nav class="nav-tabs">
      <a href="index.html" class="nav-tab-btn tab-masallar active">📖 Masallar</a>
      <a href="tekerlemeler.html" class="nav-tab-btn tab-tekerlemeler">⚡ Tekerlemeler</a>
      <a href="oyunlar.html" class="nav-tab-btn tab-oyunlar">🧩 Zeka Oyunları</a>
    </nav>

    <!-- Ana Sayfa İçerik -->
    <main id="ana-sayfa">
      <div class="hero-box">
        <h1>Merhaba Küçük Kitap Kurdu!<br>Bugün Hangi Masalı Okumak İstersin?</h1>
        <div class="category-row">
          <button class="cat-btn cat-all" onclick="kategoriFiltrele('Tümü')">
            <span class="cat-icon">⭐</span><span>Tümü</span>
          </button>
          <button class="cat-btn cat-1" onclick="kategoriFiltrele('Hayvanlar')">
            <span class="cat-icon">🦁</span><span>Hayvanlar</span>
          </button>
          <button class="cat-btn cat-2" onclick="kategoriFiltrele('Sihirli')">
            <span class="cat-icon">🧙‍♂️</span><span>Sihirli</span>
          </button>
          <button class="cat-btn cat-3" onclick="kategoriFiltrele('Uyku')">
            <span class="cat-icon">🌙</span><span>Uyku</span>
          </button>
        </div>
      </div>

      <div id="masal-grid" class="grid-container"></div>
    </main>

    <!-- Masal Okuma Detay Modu -->
    <article id="okuma-alani" class="detail-box" style="display: none;">
      <button class="back-btn" onclick="kapatMasal()">⬅ Masallara Dön</button>
      <img id="detay-resim" class="detail-img" src="" alt="Kapak">
      <h1 id="detay-baslik" class="detail-title"></h1>
      <div id="detay-metin" class="detail-text"></div>
    </article>

  </div>

  <script>
    const masallar = [
      {
        id: 1,
        baslik: "Kayıp Yavru Panda Pomi",
        kategori: "Hayvanlar",
        resim: "https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=600&auto=format&fit=crop&q=80",
        metin: `Bir zamanlar yemyeşil bambu ağaçlarıyla çevrili Sihirli Orman'da sevimli bir yavru panda yaşarmış. Adı Pomi imiş. Pomi pamuk gibi yumuşacık tüyleri ve meraklı gözleriyle ormanın en neşeli yavrusuymuş.\n\nBir akşamüstü uçuşan sarı bir ateş böceğinin peşine takılmış. Zıplamış, koşmuş, yuvarlanmış... Durup baktığında ailesini görememiş. Orman biraz karanlık ve sessiz görünüyormuş.\n\nTam burnunu çekip ağlayacakken ayağının dibinde altın sarısı bir orman feneri parlamış. Feneri patisiyle tuttuğunda ağaçtaki sevimli Bilge Baykuş seslenmiş:\n— "Korkma küçük Pomi! İçindeki cesaret ve bu fenerin ışıltısı seni ailene götürecek. Işığı takip et!"\n\nPomi adımlarını hızlandırmış ve az sonra onu arayan annesinin yumuşak kucağına kavuşmuş. Annesi ona sarılıp fısıldamış:\n— "Ne kadar karanlık olursa olsun, kalbindeki minik bir umut her zaman yolunu aydınlatır."\n\nPomi o gece lezzetli bambularını yiyip tatlı bir uykuya dalmış. İyi uykular tatlı rüyalar! 🌙✨`
      },
      {
        id: 2,
        baslik: "Uçan Renkli Balon",
        kategori: "Uyku",
        resim: "https://images.unsplash.com/photo-1507608616759-54f48f0af0ee?w=600&auto=format&fit=crop&q=80",
        metin: `Gökyüzünde rengarenk süzülen neşeli bir sıcak hava balonu varmış. Sarı, kırmızı ve gök mavisi desenleri pamuk gibi bulutların arasında ışıldarmış.\n\nRüzgar tatlı bir ninni gibi esmiş, balonu bulutların bile üstüne çıkarmış. Balon göç eden kuşlara el sallamış, güneşe gülümsemiş. Akşam olunca gökyüzü laciverte bürünmüş, yıldızlar tek tek yanmış. Balon yumuşacık bir buluta yaslanıp derin bir uykuya dalmış.`
      },
      {
        id: 3,
        baslik: "Cesur Karınca Çıtı",
        kategori: "Hayvanlar",
        resim: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=80",
        metin: `Minik karınca Çıtı yuvasına kocaman bir buğday tanesi taşımak istiyormuş. Buğday tanesi kendi boyundan tam üç kat büyükmüş!\n\nArkadaşları "Bunu tek başına taşıyamazsın, çok ağır" demişler. Ama Çıtı pes etmemiş. Önce taneyi biraz itmiş, sonra biraz çekmiş. Yavaş yavaş ama kararlılıkla buğdayı yuvasına kadar ulaştırmış. Ormandaki herkes anlamış ki: Azim ve sabır, boydan çok daha güçlüdür!`
      },
      {
        id: 4,
        baslik: "Yıldız Toplayan Çocuk",
        kategori: "Sihirli",
        resim: "https://images.unsplash.com/photo-1532767153582-b1a0e5145009?w=600&auto=format&fit=crop&q=80",
        metin: `Küçük Arda her gece penceresinden gökyüzünü izlermiş. Bir gece parlak bir yıldız odasının pervazına konmuş. Yıldız konuşabiliyormuş!\n\n— "Merhaba Arda! Bu gece gökyüzünde ışığı azalan yıldızlara yardım etmek ister misin?"\n\nArda sihirli bir rüyaya dalar gibi yıldızın peşinden uçmuş. Elindeki sevgi dolu sözcüklerle parıltısı azalan yıldızları tek tek parlatmış. O günden sonra ne zaman göğe baksa, parlayan yıldızların ona göz kırptığını bilirmiş.`
      },
      {
        id: 5,
        baslik: "Gözlüklü Bilge Baykuş",
        kategori: "Hayvanlar",
        resim: "https://images.unsplash.com/photo-1543549790-8b5f4a028cfb?w=600&auto=format&fit=crop&q=80",
        metin: `Ormandaki ulu çınarın en üst dalında yaşayan Bilge Baykuş kitap okumayı çok severmiş. Ağaç kovuğunda yapraklardan yapılmış yüzlerce kitabı varmış.\n\nOrmanın minik hayvanları ne zaman bir şey öğrenmek istese onun yanına koşarmış:\n— "Ağaçlar kışın neden yaprak döker?"\n— "Gökkuşağı nasıl oluşur?"\n\nBilge Baykuş gülümseyerek kitaplarını açar, onlara doğanın harika sırlarını anlatırmış.`
      },
      {
        id: 6,
        baslik: "Pofuduk Ayıcığın Balı",
        kategori: "Hayvanlar",
        resim: "https://images.unsplash.com/photo-1589656966895-2f33e7653819?w=600&auto=format&fit=crop&q=80",
        metin: `Sevimli ayıcık Boni karnı guruldayınca tatlı mı tatlı bal aramaya çıkmış. Ormanın en yaşlı meşesinde arıların kovanını bulmuş.\n\nBoni arılara nazikçe seslenmiş:\n— "Sevimli arılar, bana birazcık bal ikram eder misiniz? Ben de sizin için nehir kenarından taze kır çiçekleri getireyim."\n\nArılar bu kibar teklife çok sevinmiş. Boni'ye koca bir petek bal vermişler. Nezaket ve tatlı dil her kapıyı açarmış!`
      },
      {
        id: 7,
        baslik: "Sihirli Boya Kalemi",
        kategori: "Sihirli",
        resim: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=600&auto=format&fit=crop&q=80",
        metin: `Melis resim yapmayı çok severmiş. Bir gün masasında altın rengi bir boya kalemi bulmuş. Bu kalemle kağıda ne çizse birden canlanıyormuş!\n\nMelis önce kanatları parıldayan mavi bir kelebek çizmiş. Kelebek pırpır edip odada uçmuş! Sonra bahçedeki üşüyen kedi için sıcacık bir kulübe çizmiş. Melis sihrini sadece canlıları mutlu etmek için kullanmaya söz vermiş.`
      },
      {
        id: 8,
        baslik: "Uykucu Minik Koala",
        kategori: "Uyku",
        resim: "https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=600&auto=format&fit=crop&q=80",
        metin: `Okaliptüs ağacının yaprakları arasında yaşayan minik koala Koko esnemeye bayılırmış. Bir kere esnedi mi, yanındaki sincap da esner, kuştan kuşa uyku yayılırmış.\n\nKoko dalına sımsıkı sarılmış, taze yaprak kokusu eşliğinde gözlerini kapatmış. Ormanın tatlı rüzgarı onu bir beşik gibi sallamış ve mışıl mışıl uyumuş.`
      },
      {
        id: 9,
        baslik: "Mavi Yunus Doli",
        kategori: "Hayvanlar",
        resim: "https://images.unsplash.com/photo-1570481662006-a3a1374699e8?w=600&auto=format&fit=crop&q=80",
        metin: `Doli pırıl pırıl turkuaz sularda taklalar atan meraklı bir yunustu. Deniz dibindeki mercan resifleri arasında saklambaç oynamayı çok severdi.\n\nBir gün yolunu kaybeden yavru bir deniz kaplumbağası gördü. Doli hemen ona rehberlik etti ve annesini bulana kadar yanından hiç ayrılmadı. Denizlerin en büyük zenginliği dostluktu!`
      },
      {
        id: 10,
        baslik: "Bulutların Üstündeki Şato",
        kategori: "Sihirli",
        resim: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=80",
        metin: `Gökkuşağının bittiği yerde pembe bulutlardan yapılmış bir şato varmış. Bu şatonun pencereleri şekerden, kapıları ise ışıklardanmış.\n\nŞatonun içinde yaşayan iyi kalpli rüya perileri, her gece dünya üzerindeki bütün çocuklara en neşeli rüyaları dağıtmak için masallar fısıldarmış.`
      },
      {
        id: 11,
        baslik: "Ninni Söyleyen Ay Dede",
        kategori: "Uyku",
        resim: "https://images.unsplash.com/photo-1532693322450-2cb5c511067d?w=600&auto=format&fit=crop&q=80",
        metin: `Ay Dede gökyüzüne çıktığında bütün şehir yavaş yavaş uykuya hazırlanırmış. Sokak lambaları yumuşak sarı ışıklarını yakar, evlerin pencereleri tek tek kapanırmış.\n\nAy Dede gümüş ışıklarıyla pencerelere dokunur ve fısıldarmış: "Korkma güzel çocuk, yarın yeni oyunlar ve güneşli bir gün seni bekliyor. Şimdi güzelce dinlen..."`
      }
    ];

    function listele(liste) {
      const grid = document.getElementById('masal-grid');
      grid.innerHTML = '';
      liste.forEach(item => {
        const div = document.createElement('div');
        div.className = 'custom-card';
        div.innerHTML = `
          <img src="${item.resim}" class="card-img" alt="${item.baslik}">
          <div class="card-title">${item.baslik}</div>
          <button class="action-btn btn-read" onclick="masalAc(${item.id})">OKU 📖</button>
        `;
        grid.appendChild(div);
      });
    }

    function kategoriFiltrele(kat) {
      if (kat === 'Tümü') listele(masallar);
      else listele(masallar.filter(m => m.kategori === kat));
    }

    function masalAc(id) {
      const m = masallar.find(x => x.id === id);
      if (!m) return;
      document.getElementById('detay-resim').src = m.resim;
      document.getElementById('detay-baslik').innerText = m.baslik;
      document.getElementById('detay-metin').innerText = m.metin;
      document.getElementById('ana-sayfa').style.display = 'none';
      document.getElementById('okuma-alani').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function kapatMasal() {
      document.getElementById('okuma-alani').style.display = 'none';
      document.getElementById('ana-sayfa').style.display = 'block';
      window.scrollTo(0, 0);
    }

    listele(masallar);
  </script>
</body>
</html>
