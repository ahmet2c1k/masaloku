<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masal &amp; Zeka Dünyası</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- Üst Mobil Bar (Status / Gamification) -->
    <header class="app-top-bar">
      <a href="index.html" class="app-brand">
        <span style="font-size:24px;">📖</span>
        <span class="app-logo-text">Masal Dünyası</span>
      </a>
      <div class="star-counter-badge">
        <span>⭐</span>
        <span id="user-stars-count">0</span>
      </div>
    </header>

    <!-- Karşılama Kartı -->
    <section class="welcome-card" id="greeting-box">
      <h1>Merhaba Küçük Kaşif! 👋</h1>
      <p>Bugün kalbini ısıtacak harika bir masal seçelim mi?</p>
    </section>

    <!-- Ana Masal Ekranı -->
    <main id="ana-ekran">
      <div class="category-row">
        <button class="cat-btn cat-all" onclick="kategoriFiltrele('Tümü')">⭐ Tümü</button>
        <button class="cat-btn cat-1" onclick="kategoriFiltrele('Hayvanlar')">🦁 Hayvanlar</button>
        <button class="cat-btn cat-2" onclick="kategoriFiltrele('Sihirli')">🧙‍♂️ Sihirli</button>
        <button class="cat-btn cat-3" onclick="kategoriFiltrele('Uyku')">🌙 Uyku</button>
      </div>

      <div id="masal-grid" class="grid-container"></div>
    </main>

    <!-- Masal Okuma Odası (Reader) -->
    <article id="okuma-odasi" class="detail-box" style="display: none;">
      <div class="reader-toolbar">
        <button class="back-btn" onclick="kapatOkuma()">⬅ Masallara Dön</button>
        <div class="font-controls">
          <button class="font-btn" onclick="fontDegistir(-2)">A-</button>
          <button class="font-btn" onclick="fontDegistir(2)">A+</button>
        </div>
      </div>

      <button id="tts-audio-btn" class="tts-btn">🔊 Masalı Sesli Dinle</button>
      <img id="detay-resim" class="detail-img" src="" alt="Kapak">
      <h1 id="detay-baslik" class="detail-title"></h1>
      <div id="detay-metin" class="detail-text"></div>

      <button id="finish-btn" class="finish-story-btn" onclick="masaliBitir()">🎉 Masalı Bitirdim (+2 ⭐)</button>
    </article>

  </div>

  <!-- Sabit Alt Mobil Menü (Bottom Navigation) -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <span class="nav-icon">📖</span>
      <span>Masallar</span>
    </a>
    <a href="tekerlemeler.html" class="nav-item">
      <span class="nav-icon">⚡</span>
      <span>Tekerleme</span>
    </a>
    <a href="oyunlar.html" class="nav-item">
      <span class="nav-icon">🧩</span>
      <span>Oyunlar</span>
    </a>
    <a href="rozetler.html" class="nav-item">
      <span class="nav-icon">🏆</span>
      <span>Başarılarım</span>
    </a>
  </nav>

  <script src="app.js"></script>
  <script>
  let masallar = [];

    // Google Sheets Bağlantısı
    const SHEET_ID = '18Kyr4JCnu4goQzZiZnyXj90xhq_mdeoeWRwDwSLwn34';
    const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Masallar`;

    function masallariGetir() {
      fetch(URL)
        .then(res => res.text())
        .then(data => {
          // Google Sheets yanıtını temiz JSON'a çevir
          const json = JSON.parse(data.substring(47).slice(0, -2));
          masallar = json.table.rows.map(row => ({
            id: Number(row.c[0]?.v || 0),
            baslik: String(row.c[1]?.v || ''),
            kategori: String(row.c[2]?.v || 'Hayvanlar'),
            resim: String(row.c[3]?.v || ''),
            metin: String(row.c[4]?.v || '')
          }));
          listele(masallar);
        })
        .catch(err => {
          console.error("Tablodan veri çekilemedi:", err);
        });
    }

    // Sayfa açıldığında tablodan çek
    masallariGetir();

    function listele(liste) {
      const grid = document.getElementById('masal-grid');
      grid.innerHTML = '';
      const okunanlar = getOkunanMasallar();
      const favoriler = getFavoriler();

      liste.forEach(m => {
        const okunduMu = okunanlar.includes(m.id);
        const favMi = favoriler.includes(m.id);

        const div = document.createElement('div');
        div.className = 'custom-card';
        div.innerHTML = `
          <div class="card-badges">
            <span class="read-badge" style="display:${okunduMu ? 'inline-block' : 'none'};">✓ Okundu</span>
            <button class="fav-btn" onclick="favoriTikla(${m.id}, this)">${favMi ? '❤️' : '🤍'}</button>
          </div>
          <img src="${m.resim}" class="card-img" alt="${m.baslik}">
          <div class="card-title">${m.baslik}</div>
          <button class="action-btn btn-read" onclick="masalAc(${m.id})">OKU 📖</button>
        `;
        grid.appendChild(div);
      });
    }

    function kategoriFiltrele(kat) {
      if (kat === 'Tümü') listele(masallar);
      else listele(masallar.filter(m => m.kategori === kat));
    }

    function favoriTikla(id, btn) {
      favoriDegistir(id, btn);
    }

    function masalAc(id) {
      const m = masallar.find(x => x.id === id);
      if (!m) return;
      seciliMasalId = id;

      document.getElementById('detay-resim').src = m.resim;
      document.getElementById('detay-baslik').innerText = m.baslik;
      document.getElementById('detay-metin').innerText = m.metin;

      const ttsBtn = document.getElementById('tts-audio-btn');
      ttsBtn.onclick = () => sesliOkuDurdur(m.metin, ttsBtn);

      document.getElementById('ana-ekran').style.display = 'none';
      document.getElementById('greeting-box').style.display = 'none';
      document.getElementById('okuma-odasi').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function kapatOkuma() {
      if (okumaDevamEdiyor) {
        window.speechSynthesis.cancel();
        okumaDevamEdiyor = false;
      }
      document.getElementById('okuma-odasi').style.display = 'none';
      document.getElementById('greeting-box').style.display = 'block';
      document.getElementById('ana-ekran').style.display = 'block';
      listele(masallar); // Okundu rozetlerini güncellemek için
      window.scrollTo(0, 0);
    }

    function fontDegistir(fark) {
      aktifFontSize = Math.min(28, Math.max(16, aktifFontSize + fark));
      document.getElementById('detay-metin').style.fontSize = aktifFontSize + 'px';
    }

    function masaliBitir() {
      if (!seciliMasalId) return;
      const ilkDefa = masalOkunduIsaretle(seciliMasalId);
      if (ilkDefa) {
        alert('🎉 Tebrikler! Masalı bitirdin ve 2 Yıldız kazandın! ⭐⭐');
      } else {
        alert('Bu masalı daha önce tamamlamıştın, harika bir okuyucusun! 🌟');
      }
      kapatOkuma();
    }

    listele(masallar);
  </script>
</body>
</html>
