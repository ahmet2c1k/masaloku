<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Masal &amp; Zeka Dünyası</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0284c7">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- Üst Mobil Bar (Status / Gamification) -->
    <header class="app-top-bar">
      <a href="index.html" class="app-brand">
        <span style="font-size:24px;">📖</span>
        <span class="app-logo-text">Masal Dünyası</span>
      </a>
      <div class="star-counter-badge">
        <span>⭐</span>
        <span id="user-stars-count">0</span>
      </div>
    </header>

    <!-- Karşılama Kartı -->
    <section class="welcome-card" id="greeting-box">
      <h1>Merhaba Küçük Kaşif! 👋</h1>
      <p>Bugün kalbini ısıtacak harika bir masal seçelim mi?</p>
    </section>

    <!-- Ana Masal Ekranı -->
    <main id="ana-ekran">
      <div class="category-row">
        <button class="cat-btn cat-all" onclick="kategoriFiltrele('Tümü')">⭐ Tümü</button>
        <button class="cat-btn cat-1" onclick="kategoriFiltrele('Hayvanlar')">🦁 Hayvanlar</button>
        <button class="cat-btn cat-2" onclick="kategoriFiltrele('Sihirli')">🧙‍♂️ Sihirli</button>
        <button class="cat-btn cat-3" onclick="kategoriFiltrele('Uyku')">🌙 Uyku</button>
      </div>

      <div id="masal-grid" class="grid-container"></div>
    </main>

    <!-- Masal Okuma Odası (Reader) -->
    <article id="okuma-odasi" class="detail-box" style="display: none;">
      <div class="reader-toolbar">
        <button class="back-btn" onclick="kapatOkuma()">⬅ Masallara Dön</button>
        <div class="font-controls">
          <button class="font-btn" onclick="fontDegistir(-2)">A-</button>
          <button class="font-btn" onclick="fontDegistir(2)">A+</button>
        </div>
      </div>

      <button id="tts-audio-btn" class="tts-btn">🔊 Masalı Sesli Dinle</button>
      <img id="detay-resim" class="detail-img" src="" alt="Kapak">
      <h1 id="detay-baslik" class="detail-title"></h1>
      <div id="detay-metin" class="detail-text"></div>

      <button id="finish-btn" class="finish-story-btn" onclick="masaliBitir()">🎉 Masalı Bitirdim (+2 ⭐)</button>
    </article>

  </div>

  <!-- Sabit Alt Mobil Menü (Bottom Navigation) -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <span class="nav-icon">📖</span>
      <span>Masallar</span>
    </a>
    <a href="tekerlemeler.html" class="nav-item">
      <span class="nav-icon">⚡</span>
      <span>Tekerleme</span>
    </a>
    <a href="oyunlar.html" class="nav-item">
      <span class="nav-icon">🧩</span>
      <span>Oyunlar</span>
    </a>
    <a href="rozetler.html" class="nav-item">
      <span class="nav-icon">🏆</span>
      <span>Başarılarım</span>
    </a>
  </nav>

  <script src="app.js"></script>
  <script>
    const masallar = [
      {
        id: 1,
        baslik: "Kayıp Yavru Panda Pomi",
        kategori: "Hayvanlar",
        resim: "https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=600&auto=format&fit=crop&q=80",
        metin: `Bir zamanlar yemyeşil bambu ağaçlarıyla çevrili Sihirli Orman'da sevimli bir yavru panda yaşarmış. Adı Pomi imiş. Pomi pamuk gibi yumuşacık tüyleri ve meraklı gözleriyle ormanın en neşeli yavrusuymuş.\n\nBir akşamüstü uçuşan sarı bir ateş böceğinin peşine takılmış. Zıplamış, koşmuş, yuvarlanmış... Durup baktığında ailesini görememiş. Orman biraz karanlık ve sessiz görünüyormuş.\n\nTam burnunu çekip ağlayacakken ayağının dibinde altın sarısı bir orman feneri parlamış. Feneri patisiyle tuttuğunda ağaçtaki sevimli Bilge Baykuş seslenmiş:\n— "Korkma küçük Pomi! İçindeki cesaret ve bu fenerin ışıltısı seni ailene götürecek. Işığı takip et!"\n\nPomi adımlarını hızlandırmış ve az sonra onu arayan annesinin yumuşak kucağına kavuşmuş. Annesi ona sarılıp fısıldamış:\n— "Ne kadar karanlık olursa olsun, kalbindeki minik bir umut her zaman yolunu aydınlatır."\n\nPomi o gece lezzetli bambularını yiyip tatlı bir uykuya dalmış. İyi uykular tatlı rüyalar! 🌙✨`
      },
      {
        id: 2,
        baslik: "Uçan Renkli Balon",
        kategori: "Uyku",
        resim: "https://images.unsplash.com/photo-1507608616759-54f48f0af0ee?w=600&auto=format&fit=crop&q=80",
        metin: `Gökyüzünde rengarenk süzülen neşeli bir sıcak hava balonu varmış. Sarı, kırmızı ve gök mavisi desenleri pamuk gibi bulutların arasında ışıldarmış.\n\nRüzgar tatlı bir ninni gibi esmiş, balonu bulutların bile üstüne çıkarmış. Balon göç eden kuşlara el sallamış, güneşe gülümsemiş. Akşam olunca gökyüzü laciverte bürünmüş, yıldızlar tek tek yanmış. Balon yumuşacık bir buluta yaslanıp derin bir uykuya dalmış.`
      },
      {
        id: 3,
        baslik: "Cesur Karınca Çıtı",
        kategori: "Hayvanlar",
        resim: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=80",
        metin: `Minik karınca Çıtı yuvasına kocaman bir buğday tanesi taşımak istiyormuş. Buğday tanesi kendi boyundan tam üç kat büyükmüş!\n\nArkadaşları "Bunu tek başına taşıyamazsın, çok ağır" demişler. Ama Çıtı pes etmemiş. Önce taneyi biraz itmiş, sonra biraz çekmiş. Yavaş yavaş ama kararlılıkla buğdayı yuvasına kadar ulaştırmış. Ormandaki herkes anlamış ki: Azim ve sabır, boydan çok daha güçlüdür!`
      },
      {
        id: 4,
        baslik: "Yıldız Toplayan Çocuk",
        kategori: "Sihirli",
        resim: "https://images.unsplash.com/photo-1532767153582-b1a0e5145009?w=600&auto=format&fit=crop&q=80",
        metin: `Küçük Arda her gece penceresinden gökyüzünü izlermiş. Bir gece parlak bir yıldız odasının pervazına konmuş. Yıldız konuşabiliyormuş!\n\n— "Merhaba Arda! Bu gece gökyüzünde ışığı azalan yıldızlara yardım etmek ister misin?"\n\nArda sihirli bir rüyaya dalar gibi yıldızın peşinden uçmuş. Elindeki sevgi dolu sözcüklerle parıltısı azalan yıldızları tek tek parlatmış. O günden sonra ne zaman göğe baksa, parlayan yıldızların ona göz kırptığını bilirmiş.`
      },
      {
        id: 5,
        baslik: "Gözlüklü Bilge Baykuş",
        kategori: "Hayvanlar",
        resim: "https://images.unsplash.com/photo-1543549790-8b5f4a028cfb?w=600&auto=format&fit=crop&q=80",
        metin: `Ormandaki ulu çınarın en üst dalında yaşayan Bilge Baykuş kitap okumayı çok severmiş. Ağaç kovuğunda yapraklardan yapılmış yüzlerce kitabı varmış.\n\nOrmanın minik hayvanları ne zaman bir şey öğrenmek istese onun yanına koşarmış:\n— "Ağaçlar kışın neden yaprak döker?"\n— "Gökkuşağı nasıl oluşur?"\n\nBilge Baykuş gülümseyerek kitaplarını açar, onlara doğanın harika sırlarını anlatırmış.`
      },
      {
        id: 6,
        baslik: "Pofuduk Ayıcığın Balı",
        kategori: "Hayvanlar",
        resim: "https://images.unsplash.com/photo-1589656966895-2f33e7653819?w=600&auto=format&fit=crop&q=80",
        metin: `Sevimli ayıcık Boni karnı guruldayınca tatlı mı tatlı bal aramaya çıkmış. Ormanın en yaşlı meşesinde arıların kovanını bulmuş.\n\nBoni arılara nazikçe seslenmiş:\n— "Sevimli arılar, bana birazcık bal ikram eder misiniz? Ben de sizin için nehir kenarından taze kır çiçekleri getireyim."\n\nArılar bu kibar teklife çok sevinmiş. Boni'ye koca bir petek bal vermişler. Nezaket ve tatlı dil her kapıyı açarmış!`
      }
    ];

    let seciliMasalId = null;
    let aktifFontSize = 20;

    function listele(liste) {
      const grid = document.getElementById('masal-grid');
      grid.innerHTML = '';
      const okunanlar = getOkunanMasallar();
      const favoriler = getFavoriler();

      liste.forEach(m => {
        const okunduMu = okunanlar.includes(m.id);
        const favMi = favoriler.includes(m.id);

        const div = document.createElement('div');
        div.className = 'custom-card';
        div.innerHTML = `
          <div class="card-badges">
            <span class="read-badge" style="display:${okunduMu ? 'inline-block' : 'none'};">✓ Okundu</span>
            <button class="fav-btn" onclick="favoriTikla(${m.id}, this)">${favMi ? '❤️' : '🤍'}</button>
          </div>
          <img src="${m.resim}" class="card-img" alt="${m.baslik}">
          <div class="card-title">${m.baslik}</div>
          <button class="action-btn btn-read" onclick="masalAc(${m.id})">OKU 📖</button>
        `;
        grid.appendChild(div);
      });
    }

    function kategoriFiltrele(kat) {
      if (kat === 'Tümü') listele(masallar);
      else listele(masallar.filter(m => m.kategori === kat));
    }

    function favoriTikla(id, btn) {
      favoriDegistir(id, btn);
    }

    function masalAc(id) {
      const m = masallar.find(x => x.id === id);
      if (!m) return;
      seciliMasalId = id;

      document.getElementById('detay-resim').src = m.resim;
      document.getElementById('detay-baslik').innerText = m.baslik;
      document.getElementById('detay-metin').innerText = m.metin;

      const ttsBtn = document.getElementById('tts-audio-btn');
      ttsBtn.onclick = () => sesliOkuDurdur(m.metin, ttsBtn);

      document.getElementById('ana-ekran').style.display = 'none';
      document.getElementById('greeting-box').style.display = 'none';
      document.getElementById('okuma-odasi').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function kapatOkuma() {
      if (okumaDevamEdiyor) {
        window.speechSynthesis.cancel();
        okumaDevamEdiyor = false;
      }
      document.getElementById('okuma-odasi').style.display = 'none';
      document.getElementById('greeting-box').style.display = 'block';
      document.getElementById('ana-ekran').style.display = 'block';
      listele(masallar); // Okundu rozetlerini güncellemek için
      window.scrollTo(0, 0);
    }

    function fontDegistir(fark) {
      aktifFontSize = Math.min(28, Math.max(16, aktifFontSize + fark));
      document.getElementById('detay-metin').style.fontSize = aktifFontSize + 'px';
    }

    function masaliBitir() {
      if (!seciliMasalId) return;
      const ilkDefa = masalOkunduIsaretle(seciliMasalId);
      if (ilkDefa) {
        alert('🎉 Tebrikler! Masalı bitirdin ve 2 Yıldız kazandın! ⭐⭐');
      } else {
        alert('Bu masalı daha önce tamamlamıştın, harika bir okuyucusun! 🌟');
      }
      kapatOkuma();
    }

    listele(masallar);
  </script>
</body>
</html>
