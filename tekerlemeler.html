<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tekerlemeler | Masal &amp; Zeka</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <header class="app-top-bar">
      <a href="index.html" class="app-brand">
        <span style="font-size:24px;">⚡</span>
        <span class="app-logo-text">Tekerlemeler</span>
      </a>
      <div class="star-counter-badge">
        <span>⭐</span>
        <span id="user-stars-count">0</span>
      </div>
    </header>

    <main id="tekerleme-ana">
      <div class="welcome-card">
        <h1>Dil Çevikliği ve Hızlı Okuma 🏃‍♂️💨</h1>
        <p>Tekerlemeyi 3 defa takılmadan oku, dilini konuştur!</p>
      </div>

      <div id="tek-grid" class="grid-container"></div>
    </main>

    <article id="tek-detay" class="detail-box" style="display: none;">
      <button class="back-btn" onclick="kapatTek()">⬅ Tekerlemelere Dön</button>
      <button id="tek-tts-btn" class="tts-btn" style="background:#059669; box-shadow:0 4px 0 #047857;">🔊 Tekerlemeyi Dinle</button>
      <img id="tek-resim" class="detail-img" src="" alt="Kapak">
      <h1 id="tek-baslik" class="detail-title"></h1>
      <div id="tek-metin" class="detail-text"></div>
    </article>

  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">📖</span>
      <span>Masallar</span>
    </a>
    <a href="tekerlemeler.html" class="nav-item active">
      <span class="nav-icon">⚡</span>
      <span>Tekerleme</span>
    </a>
    <a href="oyunlar.html" class="nav-item">
      <span class="nav-icon">🧩</span>
      <span>Oyunlar</span>
    </a>
    <a href="rozetler.html" class="nav-item">
      <span class="nav-icon">🏆</span>
      <span>Başarılarım</span>
    </a>
  </nav>

  <script src="app.js"></script>
  <script>
    let tekerlemeler = [];

    // Google Sheets Bağlantısı (Tekerlemeler Sekmesi)
    const SHEET_ID = '18Kyr4JCnu4goQzZiZnyXj90xhq_mdeoeWRwDwSLwn34';
    const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Tekerlemeler`;

    function tekerlemeleriGetir() {
      fetch(URL)
        .then(res => res.text())
        .then(data => {
          // Google Sheets JSON çıktısını temizleme
          const json = JSON.parse(data.substring(47).slice(0, -2));
          tekerlemeler = json.table.rows.map(row => ({
            id: Number(row.c[0]?.v || 0),
            baslik: String(row.c[1]?.v || ''),
            resim: String(row.c[2]?.v || ''),
            metin: String(row.c[3]?.v || '')
          }));
          listele();
        })
        .catch(err => console.error("Tekerlemeler tablodan çekilemedi:", err));
    }

    function listele() {
      const g = document.getElementById('tek-grid');
      g.innerHTML = '';
      tekerlemeler.forEach(t => {
        const d = document.createElement('div');
        d.className = 'custom-card';
        d.innerHTML = `
          <img src="${t.resim}" class="card-img" alt="${t.baslik}">
          <div class="card-title">${t.baslik}</div>
          <button class="action-btn btn-read" style="background:#059669;box-shadow:0 4px 0 #047857;" onclick="tekAc(${t.id})">OKU ⚡</button>
        `;
        g.appendChild(d);
      });
    }

    function tekAc(id) {
      const t = tekerlemeler.find(x => x.id === id);
      if (!t) return;
      document.getElementById('tek-resim').src = t.resim;
      document.getElementById('tek-baslik').innerText = t.baslik;
      document.getElementById('tek-metin').innerText = t.metin;

      const btn = document.getElementById('tek-tts-btn');
      btn.onclick = () => sesliOkuDurdur(t.metin, btn);

      document.getElementById('tekerleme-ana').style.display = 'none';
      document.getElementById('tek-detay').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function kapatTek() {
      if (okumaDevamEdiyor) window.speechSynthesis.cancel();
      document.getElementById('tek-detay').style.display = 'none';
      document.getElementById('tekerleme-ana').style.display = 'block';
      window.scrollTo(0, 0);
    }

    // Sayfa açıldığında doğrudan Google E-Tablo'dan yükle
    tekerlemeleriGetir();
  </script>
</body>
</html>
