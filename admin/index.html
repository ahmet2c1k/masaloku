<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yönetim Paneli</title>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.1.2/dist/decap-cms.js"></script>
</head>
<body>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'ahmet2c1k/masaloku',
          branch: 'main'
        },
        load_config_file: false,
        media_folder: 'images',
        public_folder: 'images',
        collections: [
          {
            name: 'masallar',
            label: '📖 Masallar',
            files: [
              {
                file: 'masallar.json',
                label: 'Tüm Masallar',
                name: 'masallar_listesi',
                fields: [
                  {
                    label: 'Masallar Listesi',
                    name: 'masallar',
                    widget: 'list',
                    fields: [
                      { label: 'ID', name: 'id', widget: 'number', value_type: 'int' },
                      { label: 'Başlık', name: 'baslik', widget: 'string' },
                      { label: 'Kategori', name: 'kategori', widget: 'select', options: ['Hayvanlar', 'Sihirli', 'Uyku'] },
                      { label: 'Kapak Resmi URL', name: 'resim', widget: 'string' },
                      { label: 'Masal Metni', name: 'metin', widget: 'text' }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
