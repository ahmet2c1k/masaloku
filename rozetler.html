<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jojupof &amp; Mağaza | Masal &amp; Zeka</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: #fffbeb;
      margin: 0;
      padding: 0 0 90px 0;
      color: #1e293b;
    }
    .container { max-width: 540px; margin: 0 auto; padding: 16px; }
    
    .app-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 12px 18px;
      border-radius: 22px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      margin-bottom: 18px;
      border: 3px solid #fef3c7;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 20px;
      font-weight: 900;
      color: #ea580c;
    }
    .star-counter-badge {
      background: #fef08a;
      color: #854d0e;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      box-shadow: 0 3px 0 #facc15;
    }

    /* Jojupof Sahne Kartı */
    .pet-card {
      background: linear-gradient(180deg, #ffffff 0%, #fff7ed 100%);
      border-radius: 28px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(234, 88, 12, 0.12);
      border: 4px solid #fed7aa;
      margin-bottom: 20px;
      position: relative;
    }
    .pet-badge-level {
      display: inline-block;
      background: #f97316;
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      padding: 5px 14px;
      border-radius: 16px;
      margin-bottom: 6px;
    }
    .pet-name { font-size: 26px; font-weight: 900; color: #7c2d12; margin: 0 0 4px 0; }
    .pet-speech {
      font-size: 13px;
      font-weight: 800;
      color: #9a3412;
      background: #ffedd5;
      display: inline-block;
      padding: 6px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
    }

    /* Karakter Sahnesi */
    .pet-stage {
      position: relative;
      width: 190px;
      height: 190px;
      margin: 0 auto 12px auto;
      background: radial-gradient(circle, #ffedd5 45%, rgba(255,255,255,0) 72%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .pet-svg-container {
      width: 170px;
      height: 170px;
      filter: drop-shadow(0 8px 12px rgba(124, 45, 18, 0.15));
      animation: floatPet 3s ease-in-out infinite;
    }
    @keyframes floatPet {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .pet-svg-container.bounce { animation: bouncePet 0.5s ease-in-out; }
    @keyframes bouncePet {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18) rotate(-4deg); }
    }

    .floating-effect {
      position: absolute;
      font-size: 30px;
      pointer-events: none;
      animation: flyUp 0.9s forwards ease-out;
      z-index: 10;
    }
    @keyframes flyUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.4); }
    }

    /* Sev & Besle Butonları */
    .pet-actions { display: flex; justify-content: center; gap: 10px; }
    .pet-btn {
      flex: 1;
      max-width: 145px;
      padding: 10px 12px;
      border-radius: 16px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      color: #fff;
    }
    .btn-love { background: #ec4899; box-shadow: 0 4px 0 #be185d; }
    .btn-feed { background: #10b981; box-shadow: 0 4px 0 #047857; }

    /* MAĞAZA / GARDIROP ALANI */
    .section-title {
      font-size: 19px;
      font-weight: 900;
      color: #0f172a;
      margin: 18px 4px 12px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .shop-item {
      background: #ffffff;
      border-radius: 22px;
      padding: 14px 12px;
      text-align: center;
      border: 3px solid #f1f5f9;
      box-shadow: 0 6px 14px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .shop-item.equipped {
      border-color: #f97316;
      background: #fff7ed;
    }
    .shop-icon { font-size: 40px; margin-bottom: 6px; }
    .shop-name { font-size: 15px; font-weight: 900; color: #1e293b; margin-bottom: 4px; }
    .shop-price { font-size: 13px; font-weight: 800; color: #b45309; margin-bottom: 10px; }
    
    .shop-btn {
      width: 100%;
      padding: 8px;
      border-radius: 14px;
      border: none;
      font-family: inherit;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-buy { background: #facc15; color: #713f12; box-shadow: 0 3px 0 #eab308; }
    .btn-equip { background: #3b82f6; color: #ffffff; box-shadow: 0 3px 0 #1d4ed8; }
    .btn-unequip { background: #f97316; color: #ffffff; box-shadow: 0 3px 0 #c2410c; }

    /* Alt Menü */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
      border-top: 3px solid #f1f5f9;
      z-index: 100;
    }
    .nav-item {
      text-decoration: none;
      color: #64748b;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nav-item.active { color: #f97316; }
    .nav-icon { font-size: 22px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Üst Bar -->
    <header class="app-top-bar">
      <a href="index.html" class="app-brand">
        <span style="font-size:26px;">🐾</span>
        <span>Jojupof Dünyası</span>
      </a>
      <div class="star-counter-badge">
        <span>⭐</span>
        <span id="user-stars-count">0</span>
      </div>
    </header>

    <!-- JOJUPOF SAHNESİ -->
    <section class="pet-card">
      <div class="pet-badge-level">Sevimli Dostun</div>
      <h2 class="pet-name">Jojupof 🐾</h2>
      <div class="pet-speech" id="jojupof-speech">"Bana yeni kıyafetler alır mısın? 🥰"</div>

      <div class="pet-stage" id="pet-stage-area" onclick="jojupofSev()">
        <div class="pet-svg-container" id="pet-avatar-wrapper">
          <!-- Kapibara + Giydirilen Kıyafetler Buraya Çizilir -->
        </div>
      </div>

      <div class="pet-actions">
        <button class="pet-btn btn-love" onclick="jojupofSev()">❤️ Sev</button>
        <button class="pet-btn btn-feed" onclick="jojupofBesle()">🍉 Karpuz Ver</button>
      </div>
    </section>

    <!-- JOJUPOF MAĞAZASI & GARDIROBU -->
    <h3 class="section-title">🛍️ Jojupof Gardırobu (Yıldızla Al &amp; Giydir)</h3>
    <div class="shop-grid" id="shop-grid"></div>

  </div>

  <!-- Alt Menü -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">📖</span>
      <span>Masallar</span>
    </a>
    <a href="tekerlemeler.html" class="nav-item">
      <span class="nav-icon">⚡</span>
      <span>Tekerleme</span>
    </a>
    <a href="oyunlar.html" class="nav-item">
      <span class="nav-icon">🧩</span>
      <span>Oyunlar</span>
    </a>
    <a href="rozetler.html" class="nav-item active">
      <span class="nav-icon">🏆</span>
      <span>Jojupof</span>
    </a>
  </nav>

  <script src="app.js"></script>
  <script>
    /* YILDIZ BAKİYESİ YÖNETİMİ */
    function bakiyeGetir() {
      if (typeof getYildizSayisi === 'function') return getYildizSayisi();
      return parseInt(localStorage.getItem('toplam_yildiz') || '0', 10);
    }

    function bakiyeGuncelle(yeniDeger) {
      localStorage.setItem('toplam_yildiz', yeniDeger);
      // Eğer app.js farklı bir anahtar kullanıyorsa onu da senkronize et
      if (localStorage.getItem('masal_yildiz') !== null) {
        localStorage.setItem('masal_yildiz', yeniDeger);
      }
      document.getElementById('user-stars-count').innerText = yeniDeger;
    }

    /* MAĞAZA ÜRÜNLERİ VE SVG ÇİZİMLERİ */
    const aksesuarlar = [
      {
        id: 'mandalina',
        ad: 'Taze Mandalina',
        kategori: 'sapka',
        fiyat: 0, // Başlangıçta hediye!
        icon: '🍊',
        svg: `<circle cx="60" cy="24" r="9" fill="#EA580C"/><path d="M60 15 Q66 11 68 15 Q64 19 60 17" fill="#15803D"/>`
      },
      {
        id: 'papyon',
        ad: 'Kırmızı Papyon',
        kategori: 'boyun',
        fiyat: 4,
        icon: '🎀',
        svg: `<polygon points="48,74 60,80 48,86" fill="#EF4444"/><polygon points="72,74 60,80 72,86" fill="#EF4444"/><circle cx="60" cy="80" r="3.5" fill="#B91C1C"/>`
      },
      {
        id: 'gozluk',
        ad: 'Havalı Gözlük',
        kategori: 'goz',
        fiyat: 6,
        icon: '🕶️',
        svg: `<rect x="39" y="44" width="17" height="11" rx="3" fill="#0F172A"/><rect x="64" y="44" width="17" height="11" rx="3" fill="#0F172A"/><line x1="56" y1="48" x2="64" y2="48" stroke="#0F172A" stroke-width="3"/><line x1="42" y1="47" x2="47" y2="47" stroke="#38BDF8" stroke-width="2"/>`
      },
      {
        id: 'sihirbaz_sapka',
        ad: 'Sihirbaz Şapkası',
        kategori: 'sapka',
        fiyat: 8,
        icon: '🎩',
        svg: `<ellipse cx="60" cy="30" rx="26" ry="5" fill="#1E1B4B"/><path d="M42 30 L60 4 L78 30 Z" fill="#312E81"/><path d="M45 26 L75 26" stroke="#FACC15" stroke-width="3"/>`
      },
      {
        id: 'spor_ayakkabi',
        ad: 'Kırmızı Patik Ayakkabı',
        kategori: 'ayak',
        fiyat: 10,
        icon: '👟',
        svg: `<rect x="32" y="98" width="20" height="12" rx="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/><rect x="68" y="98" width="20" height="12" rx="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/><line x1="38" y1="102" x2="46" y2="102" stroke="#FFFFFF" stroke-width="2"/><line x1="74" y1="102" x2="82" y2="102" stroke="#FFFFFF" stroke-width="2"/>`
      },
      {
        id: 'kral_taci',
        ad: 'Altın Kral Tacı',
        kategori: 'sapka',
        fiyat: 15,
        icon: '👑',
        svg: `<path d="M40 31 L44 15 L53 24 L60 12 L67 24 L76 15 L80 31 Z" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/><circle cx="60" cy="18" r="2.5" fill="#EF4444"/>`
      },
      {
        id: 'ejder_kanat',
        ad: 'Ejderha Kanatları',
        kategori: 'sirt',
        fiyat: 20,
        icon: '🐲',
        svg: `<path d="M26 58 Q4 40 10 74 Q22 78 30 70 Z" fill="#10B981" stroke="#047857" stroke-width="2"/><path d="M94 58 Q116 40 110 74 Q98 78 90 70 Z" fill="#10B981" stroke="#047857" stroke-width="2"/>`
      }
    ];

    // Envanter (Satın alınanlar) ve Giydirilenler
    function getEnvanter() {
      const kayit = localStorage.getItem('jojupof_envanter');
      return kayit ? JSON.parse(kayit) : ['mandalina'];
    }
    function setEnvanter(liste) {
      localStorage.setItem('jojupof_envanter', JSON.stringify(liste));
    }

    function getGiyilenler() {
      const kayit = localStorage.getItem('jojupof_giyilenler');
      return kayit ? JSON.parse(kayit) : { sapka: 'mandalina', goz: null, boyun: null, ayak: null, sirt: null };
    }
    function setGiyilenler(obj) {
      localStorage.setItem('jojupof_giyilenler', JSON.stringify(obj));
    }

    /* JOJUPOF'U VE ÜZERİNDEKİ KIYAFETLERİ ÇİZ */
    function jojupofCiz() {
      const giyilen = getGiyilenler();
      const bulSvg = (id) => {
        const u = aksesuarlar.find(x => x.id === id);
        return u ? u.svg : '';
      };

      const tamSvg = `
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Sırt Aksesuarı (Kanat vb.) -->
          ${bulSvg(giyilen.sirt)}
          
          <!-- Kapibara Gövde -->
          <ellipse cx="60" cy="76" rx="38" ry="28" fill="#92400E"/>
          <!-- Normal Patiler -->
          <ellipse cx="42" cy="102" rx="8" ry="5" fill="#78350F"/>
          <ellipse cx="78" cy="102" rx="8" ry="5" fill="#78350F"/>

          <!-- Kafa -->
          <rect x="35" y="32" width="50" height="46" rx="22" fill="#B45309"/>
          <!-- Kulaklar -->
          <ellipse cx="36" cy="38" rx="6" ry="8" fill="#78350F"/>
          <ellipse cx="84" cy="38" rx="6" ry="8" fill="#78350F"/>
          
          <!-- Gözler -->
          <circle cx="48" cy="49" r="3.5" fill="#1E293B"/>
          <circle cx="72" cy="49" r="3.5" fill="#1E293B"/>
          
          <!-- Pembe Yanaklar -->
          <circle cx="41" cy="57" r="5" fill="#F472B6" opacity="0.65"/>
          <circle cx="79" cy="57" r="5" fill="#F472B6" opacity="0.65"/>
          
          <!-- Burun ve Ağız -->
          <rect x="52" y="53" width="16" height="11" rx="5.5" fill="#78350F"/>
          <path d="M56 68 Q60 72 64 68" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>

          <!-- Giydirilen Kıyafet Katmanları -->
          ${bulSvg(giyilen.boyun)}
          ${bulSvg(giyilen.goz)}
          ${bulSvg(giyilen.sapka)}
          ${bulSvg(giyilen.ayak)}
        </svg>
      `;

      document.getElementById('pet-avatar-wrapper').innerHTML = tamSvg;
    }

    /* MAĞAZAYI LİSTELE */
    function magazaCiz() {
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = '';
      const envanter = getEnvanter();
      const giyilen = getGiyilenler();

      aksesuarlar.forEach(urun => {
        const sahipMi = envanter.includes(urun.id);
        const giyiyorMu = giyilen[urun.kategori] === urun.id;

        const card = document.createElement('div');
        card.className = 'shop-item ' + (giyiyorMu ? 'equipped' : '');

        let butonHtml = '';
        if (!sahipMi) {
          butonHtml = `<button class="shop-btn btn-buy" onclick="urunSatinAl('${urun.id}')">⭐ ${urun.fiyat} Satın Al</button>`;
        } else if (giyiyorMu) {
          butonHtml = `<button class="shop-btn btn-unequip" onclick="urunCikar('${urun.kategori}')">✓ Giydirildi (Çıkar)</button>`;
        } else {
          butonHtml = `<button class="shop-btn btn-equip" onclick="urunGiydir('${urun.id}', '${urun.kategori}')">👕 Giydir</button>`;
        }

        card.innerHTML = `
          <div>
            <div class="shop-icon">${urun.icon}</div>
            <div class="shop-name">${urun.ad}</div>
            <div class="shop-price">${sahipMi ? 'Senin Eşyan ✨' : urun.fiyat + ' Yıldız ⭐'}</div>
          </div>
          ${butonHtml}
        `;
        grid.appendChild(card);
      });
    }

    function urunSatinAl(id) {
      const urun = aksesuarlar.find(x => x.id === id);
      if (!urun) return;

      const bakiye = bakiyeGetir();
      if (bakiye < urun.fiyat) {
        document.getElementById('jojupof-speech').innerText = `"Yıldızımız yetmedi! Masal okuyup oyun oynayarak yıldız toplayalım! 🌟"`;
        alert(`Bu eşya için ${urun.fiyat} ⭐ gerekiyor. Senin şu an ${bakiye} ⭐ yıldızın var!`);
        return;
      }

      // Yıldızı düş, envantere ekle ve hemen giydir
      bakiyeGuncelle(bakiye - urun.fiyat);
      const env = getEnvanter();
      env.push(urun.id);
      setEnvanter(env);

      urunGiydir(urun.id, urun.kategori);
      animasyonYap('🎉');
      document.getElementById('jojupof-speech').innerText = `"Yaşasın! Yeni ${urun.ad} bana çok yakıştı! 🥰"`;
    }

    function urunGiydir(id, kategori) {
      const giyilen = getGiyilenler();
      giyilen[kategori] = id;
      setGiyilenler(giyilen);
      jojupofCiz();
      magazaCiz();
      animasyonYap('✨');
    }

    function urunCikar(kategori) {
      const giyilen = getGiyilenler();
      giyilen[kategori] = null;
      setGiyilenler(giyilen);
      jojupofCiz();
      magazaCiz();
    }

    function jojupofSev() {
      animasyonYap('❤️');
      const sozler = [
        '"Gıdıklandım! Seni çok seviyorum! 🥰"',
        '"Kıyafetlerim nasıl olmuş? 🐾"',
        '"Birlikte yeni bir masal okuyalım mı? 📖"'
      ];
      document.getElementById('jojupof-speech').innerText = sozler[Math.floor(Math.random() * sozler.length)];
    }

    function jojupofBesle() {
      animasyonYap('🍉');
      document.getElementById('jojupof-speech').innerText = '"Ham hum şap şup! Karpuz çok lezzetliydi! 🍉😋"';
    }

    function animasyonYap(emoji) {
      const stage = document.getElementById('pet-stage-area');
      const avatar = document.getElementById('pet-avatar-wrapper');
      
      avatar.classList.remove('bounce');
      void avatar.offsetWidth;
      avatar.classList.add('bounce');

      const fly = document.createElement('div');
      fly.className = 'floating-effect';
      fly.innerText = emoji;
      fly.style.left = (Math.random() * 50 + 25) + '%';
      fly.style.top = '35%';
      stage.appendChild(fly);

      setTimeout(() => fly.remove(), 900);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('user-stars-count').innerText = bakiyeGetir();
      jojupofCiz();
      magazaCiz();
    });
  </script>
</body>
</html>
