<html lang="tr">
<head>
  <meta charset="UTF-8">

  <title>Jojupof &amp; Başarılarım | Masal &amp; Zeka</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Jojupof Sanal Bebek Alanı */
    .pet-card {
      background: linear-gradient(180deg, #ffffff 0%, #fff7ed 100%);
      border-radius: 28px;
      padding: 22px 16px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(234, 88, 12, 0.12);
      border: 4px solid #fed7aa;
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .pet-badge-level {
      display: inline-block;
      background: #f97316;
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      padding: 5px 14px;
      border-radius: 16px;
      margin-bottom: 8px;
      box-shadow: 0 3px 0 #c2410c;
    }

    .pet-name {
      font-size: 26px;
      font-weight: 900;
      color: #7c2d12;
      margin-bottom: 4px;
    }

    .pet-title {
      font-size: 14px;
      font-weight: 800;
      color: #ea580c;
      margin-bottom: 14px;
    }

    /* Karakter Sahnesi */
    .pet-stage {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 14px auto;
      background: radial-gradient(circle, #ffedd5 40%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .pet-avatar {
      font-size: 90px;
      line-height: 1;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
      animation: floatPet 3s ease-in-out infinite;
    }

    @keyframes floatPet {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .pet-avatar.bounce {
      animation: bouncePet 0.5s ease-in-out;
    }

    @keyframes bouncePet {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25) rotate(-5deg); }
    }

    /* Uçuşan Kalp & Karpuz Efekti */
    .floating-effect {
      position: absolute;
      font-size: 28px;
      pointer-events: none;
      animation: flyUp 0.9s forwards ease-out;
    }

    @keyframes flyUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.4); }
    }

    /* XP Büyüme Barı */
    .xp-container {
      background: #f1f5f9;
      border: 3px solid #e2e8f0;
      border-radius: 20px;
      height: 24px;
      width: 90%;
      margin: 0 auto 8px auto;
      overflow: hidden;
      position: relative;
    }

    .xp-fill {
      background: linear-gradient(90deg, #f59e0b, #10b981);
      height: 100%;
      width: 20%;
      border-radius: 16px;
      transition: width 0.4s ease;
    }

    .xp-text {
      font-size: 13px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 14px;
    }

    /* Butonlar: Sev & Besle */
    .pet-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .pet-btn {
      flex: 1;
      max-width: 150px;
      padding: 10px 14px;
      border-radius: 18px;
      border: none;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-love {
      background: #ec4899;
      color: #ffffff;
      box-shadow: 0 4px 0 #be185d;
    }
    .btn-love:active { transform: translateY(2px); box-shadow: 0 2px 0 #be185d; }

    .btn-feed {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 4px 0 #047857;
    }
    .btn-feed:active { transform: translateY(2px); box-shadow: 0 2px 0 #047857; }

    /* Rozet Kartları */
    .badges-section-title {
      font-size: 20px;
      font-weight: 900;
      color: #0f172a;
      margin: 20px 6px 12px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-card {
      background: #ffffff;
      border-radius: 22px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.05);
      border: 3px solid #ffffff;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .badge-card.locked {
      opacity: 0.55;
      filter: grayscale(0.8);
      background: #f8fafc;
    }

    .badge-icon {
      font-size: 38px;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fef08a;
      flex-shrink: 0;
    }

    .badge-info h3 { font-size: 16px; font-weight: 900; color: #0f172a; margin-bottom: 2px; }
    .badge-info p { font-size: 12px; font-weight: 700; color: #64748b; }
    .badge-status { margin-left: auto; font-size: 20px; }
  </style>
</head>
