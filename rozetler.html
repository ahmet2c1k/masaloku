<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jojupof Evrim &amp; Gardırop | Masal &amp; Zeka</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%);
      background-attachment: fixed;
      margin: 0;
      padding: 0 0 95px 0;
      color: #1e293b;
    }
    .container { max-width: 520px; margin: 0 auto; padding: 14px; }

    /* Üst Bar */
    .app-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.94);
      padding: 12px 18px;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      margin-bottom: 16px;
      border: 2px solid #ffffff;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 20px;
      font-weight: 900;
      color: #ea580c;
    }
    .star-counter-badge {
      background: linear-gradient(135deg, #fde047, #f59e0b);
      color: #78350f;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      box-shadow: 0 3px 0 #d97706;
    }

    /* JOJUPOF EVRİM VE SAHNE KARTI */
    .pet-room-card {
      background: linear-gradient(180deg, #e0f2fe 0%, #fef9c3 65%, #dcfce7 100%);
      border-radius: 30px;
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
      border: 4px solid #ffffff;
      margin-bottom: 18px;
      position: relative;
    }
    .level-header-pill {
      display: inline-block;
      background: linear-gradient(90deg, #f97316, #ea580c);
      color: #fff;
      font-weight: 900;
      font-size: 13px;
      padding: 5px 16px;
      border-radius: 16px;
      box-shadow: 0 3px 0 #9a3412;
      margin-bottom: 6px;
    }
    .pet-stage-title {
      font-size: 22px;
      font-weight: 900;
      color: #7c2d12;
      margin: 0 0 6px 0;
    }
    .pet-speech {
      background: #ffffff;
      color: #9a3412;
      font-size: 13px;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    /* Sahne */
    .pet-stage {
      position: relative;
      width: 210px;
      height: 200px;
      margin: 0 auto 8px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .pet-svg-container {
      width: 195px;
      height: 195px;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,0.15));
      animation: floatPet 3s ease-in-out infinite;
    }
    @keyframes floatPet {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .pet-svg-container.bounce { animation: bouncePet 0.5s ease-in-out; }
    @keyframes bouncePet {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.16) rotate(-3deg); }
    }
    .floating-effect {
      position: absolute;
      font-size: 32px;
      pointer-events: none;
      animation: flyUp 0.9s forwards ease-out;
      z-index: 10;
    }
    @keyframes flyUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-75px) scale(1.4); }
    }

    /* BÜYÜME (XP) BARI */
    .xp-box {
      background: rgba(255,255,255,0.85);
      border-radius: 18px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 2px solid #ffffff;
    }
    .xp-bar-bg {
      background: #e2e8f0;
      height: 18px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .xp-bar-fill {
      background: linear-gradient(90deg, #f59e0b, #10b981);
      height: 100%;
      width: 20%;
      border-radius: 12px;
      transition: width 0.4s ease;
    }
    .xp-info-text {
      font-size: 12px;
      font-weight: 900;
      color: #475569;
      display: flex;
      justify-content: space-between;
    }

    /* Evrim Önizleme Şeridi */
    .evo-roadmap {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .evo-step {
      font-size: 11px;
      font-weight: 900;
      padding: 5px 9px;
      border-radius: 12px;
      background: rgba(255,255,255,0.6);
      color: #64748b;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .evo-step.unlocked {
      background: #ffffff;
      color: #0f172a;
      border-color: #fde047;
    }
    .evo-step.current {
      background: #fef08a;
      color: #854d0e;
      border-color: #f59e0b;
      transform: scale(1.05);
    }

    .pet-actions { display: flex; justify-content: center; gap: 10px; }
    .pet-btn {
      flex: 1;
      max-width: 155px;
      padding: 10px 12px;
      border-radius: 16px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      color: #fff;
    }
    .btn-love { background: #ec4899; box-shadow: 0 4px 0 #be185d; }
    .btn-feed { background: #10b981; box-shadow: 0 4px 0 #047857; }

    /* Kategori Sekmeleri */
    .wardrobe-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .w-tab {
      background: rgba(255,255,255,0.85);
      border: 2px solid #fff;
      padding: 8px 14px;
      border-radius: 16px;
      font-weight: 900;
      font-size: 13px;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
    }
    .w-tab.active {
      background: #ea580c;
      color: #fff;
      border-color: #ea580c;
    }

    /* Mağaza Izgarası */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .shop-item {
      background: rgba(255,255,255,0.95);
      border-radius: 22px;
      padding: 14px 10px;
      text-align: center;
      border: 3px solid #ffffff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .shop-item.equipped {
      border-color: #f97316;
      background: #fff7ed;
    }
    .shop-icon { font-size: 38px; margin-bottom: 4px; }
    .shop-name { font-size: 14px; font-weight: 900; color: #0f172a; margin-bottom: 4px; }
    .shop-price { font-size: 12px; font-weight: 800; color: #d97706; margin-bottom: 8px; }
    .shop-btn {
      width: 100%;
      padding: 9px;
      border-radius: 14px;
      border: none;
      font-family: inherit;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-buy { background: #fde047; color: #713f12; box-shadow: 0 3px 0 #ca8a04; }
    .btn-equip { background: #3b82f6; color: #ffffff; box-shadow: 0 3px 0 #1d4ed8; }
    .btn-unequip { background: #f97316; color: #ffffff; box-shadow: 0 3px 0 #c2410c; }

    /* Alt Menü */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
      border-top: 2px solid #f1f5f9;
      z-index: 100;
    }
    .nav-item {
      text-decoration: none;
      color: #64748b;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nav-item.active { color: #ea580c; }
    .nav-icon { font-size: 22px; }
  </style>
</head>

    /* TOPLAM BÜYÜME PUANI (XP) - HARCANMAZ, SADECE ARTAR */
    function getToplamXp() {
      const cüzdan = getYildizSayisi();
      let kayitliXp = parseInt(localStorage.getItem('jojupof_toplam_xp') || '0', 10);
      // En az mevcut yıldız + harcanan kıyafetler kadar XP olmalı
      const envanter = getEnvanter();
      let harcanan = 0;
      envanter.forEach(id => {
        const u = aksesuarlar.find(x => x.id === id);
        if (u) harcanan += u.fiyat;
      });
      const gercekMinimumXp = cüzdan + harcanan;
      if (gercekMinimumXp > kayitliXp) {
        kayitliXp = gercekMinimumXp;
        localStorage.setItem('jojupof_toplam_xp', kayitliXp);
      }
      return kayitliXp;
    }

    function xpArtir(miktar) {
      const suAn = getToplamXp();
      localStorage.setItem('jojupof_toplam_xp', suAn + miktar);

      // Kanat & Sırt
      {
        id: 'pelerin', ad: 'Süper Kahraman Pelerini', kategori: 'sirt', fiyat: 12, icon: '🦸',
        svg: `<path d="M32 62 L14 102 L106 102 L88 62 Z" fill="#EF4444"/>`
      },
      {
        id: 'melek_kanat', ad: 'Melek Kanatları & Hale', kategori: 'sirt', fiyat: 15, icon: '👼',
        svg: `<path d="M28 62 Q4 35 6 62 Q10 74 18 76 Q12 84 22 86 Q30 84 34 74 Z" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2.5"/><path d="M92 62 Q116 35 114 62 Q110 74 102 76 Q108 84 98 86 Q90 84 86 74 Z" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2.5"/><ellipse cx="60" cy="14" rx="20" ry="5" stroke="#FACC15" stroke-width="3.5" fill="none"/>`
      },
      {
        id: 'ejder_kanat', ad: 'Zümrüt Ejder Kanatları', kategori: 'sirt', fiyat: 18, icon: '🐲',
        svg: `<path d="M26 58 Q4 38 10 74 Q22 78 30 70 Z" fill="#10B981" stroke="#047857" stroke-width="2"/><path d="M94 58 Q116 38 110 74 Q98 78 90 70 Z" fill="#10B981" stroke="#047857" stroke-width="2"/>`
      }
    ];

    function getEnvanter() {
      return JSON.parse(localStorage.getItem('jojupof_envanter') || '["mandalina"]');
    }
    function setEnvanter(liste) {
      localStorage.setItem('jojupof_envanter', JSON.stringify(liste));
    }

    function getGiyilenler() {
      return JSON.parse(localStorage.getItem('jojupof_giyilenler') || '{"sapka":"mandalina","goz":null,"boyun":null,"ayak":null,"sirt":null}');
    }
    function setGiyilenler(obj) {
      localStorage.setItem('jojupof_giyilenler', JSON.stringify(obj));
    }

    function evrimHesapla() {
      const xp = getToplamXp();
      let ulasilan = evrimler[0];
      let sonraki = evrimler[1];

      for (let i = 0; i < evrimler.length; i++) {
        if (xp >= evrimler[i].minXp) {
          ulasilan = evrimler[i];
          sonraki = evrimler[i + 1] || null;
        }
      }

      if (!seciliEvrimSeviyesi || seciliEvrimSeviyesi > ulasilan.seviye) {
        seciliEvrimSeviyesi = ulasilan.seviye;
      }

      const aktifEvrimObj = evrimler.find(e => e.seviye === seciliEvrimSeviyesi) || ulasilan;

      document.getElementById('pet-level-badge').innerText = `Seviye ${ulasilan.seviye} (Toplam ${xp} XP)`;
      document.getElementById('pet-stage-title').innerText = aktifEvrimObj.ad;

      if (sonraki) {
        const aralik = sonraki.minXp - ulasilan.minXp;
        const ilerleme = xp - ulasilan.minXp;
        const yuzde = Math.min(100, Math.max(8, Math.round((ilerleme / aralik) * 100)));
        document.getElementById('xp-bar-fill').style.width = yuzde + '%';
        document.getElementById('xp-left-text').innerText = `Büyüme: ${xp} / ${sonraki.minXp} XP`;
        document.getElementById('xp-right-text').innerText = `${sonraki.kisaAd} için ${sonraki.minXp - xp} XP kaldı!`;
      } else {
        document.getElementById('xp-bar-fill').style.width = '100%';
        document.getElementById('xp-left-text').innerText = `Maksimum Evrim! (${xp} XP)`;
        document.getElementById('xp-right-text').innerText = `Tüm Evrimler Açıldı! 🎉`;
      }

      // Evrim yol haritasını çiz
      const roadmap = document.getElementById('evo-roadmap');
      roadmap.innerHTML = '';
      evrimler.forEach(ev => {
        const acikMi = xp >= ev.minXp;
        const seciliMi = ev.seviye === seciliEvrimSeviyesi;
        const btn = document.createElement('div');
        btn.className = 'evo-step ' + (acikMi ? 'unlocked ' : '') + (seciliMi ? 'current' : '');
        btn.innerText = acikMi ? ev.kisaAd : `🔒 Sv.${ev.seviye} (${ev.minXp} XP)`;
        btn.onclick = () => {
          if (acikMi) {
            seciliEvrimSeviyesi = ev.seviye;
            jojupofCiz();
            evrimHesapla();
          } else {
            alert(`${ev.ad} formunu açmak için toplam ${ev.minXp} XP gerekiyor! Masal okuyarak veya oyun oynayarak XP kazanabilirsin.`);
          }
        };
        roadmap.appendChild(btn);
      });

      return aktifEvrimObj;
    }

    function jojupofCiz() {
      const aktifEvrim = evrimHesapla();
      const giyilen = getGiyilenler();
      const bulSvg = (id) => {
        const u = aksesuarlar.find(x => x.id === id);
        return u ? u.svg : '';
      };

      const tamSvg = `
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Evrimin Kendi Arka Plan / Kanat / Pelerin Aurası -->
          ${aktifEvrim.arkaAura}
          <!-- Gardıroptan Giyilen Sırt Aksesuarı -->
          ${bulSvg(giyilen.sirt)}
          
          <!-- Kapibara Gövde -->
          <ellipse cx="60" cy="76" rx="38" ry="28" fill="#92400E"/>
          <ellipse cx="42" cy="102" rx="8" ry="5" fill="#78350F"/>
          <ellipse cx="78" cy="102" rx="8" ry="5" fill="#78350F"/>
          
          <!-- Kafa -->
          <rect x="35" y="32" width="50" height="46" rx="22" fill="#B45309"/>
          <ellipse cx="36" cy="38" rx="6" ry="8" fill="#78350F"/>
          <ellipse cx="84" cy="38" rx="6" ry="8" fill="#78350F"/>
          
          <!-- Gözler -->
          <circle cx="48" cy="49" r="3.5" fill="#1E293B"/>
          <circle cx="72" cy="49" r="3.5" fill="#1E293B"/>
          
          <!-- Pembe Yanaklar -->
          <circle cx="41" cy="57" r="5" fill="#F472B6" opacity="0.65"/>
          <circle cx="79" cy="57" r="5" fill="#F472B6" opacity="0.65"/>
          
          <!-- Burun ve Ağız -->
          <rect x="52" y="53" width="16" height="11" rx="5.5" fill="#78350F"/>
          <path d="M56 68 Q60 72 64 68" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>

          <!-- Evrimin Kendi Ön Aksesuarı (Bebek emziği, Melek halesi, Ejder boynuzu vb.) -->
          ${aktifEvrim.onEkstra}

          <!-- Gardıroptan Giyilen Kıyafetler -->
          ${bulSvg(giyilen.boyun)}
          ${bulSvg(giyilen.goz)}
          ${bulSvg(giyilen.sapka)}
          ${bulSvg(giyilen.ayak)}
        </svg>
      `;
      document.getElementById('pet-avatar-wrapper').innerHTML = tamSvg;
    }

    function kategoriSec(kat, btn) {
      aktifKategori = kat;
      document.querySelectorAll('.w-tab').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      magazaCiz();
    }

    function magazaCiz() {
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = '';
      const envanter = getEnvanter();
      const giyilen = getGiyilenler();

      const liste = aktifKategori === 'hepsi'
        ? aksesuarlar
        : aksesuarlar.filter(x => x.kategori === aktifKategori);

      liste.forEach(urun => {
        const sahipMi = envanter.includes(urun.id);
        const giyiyorMu = giyilen[urun.kategori] === urun.id;

        const card = document.createElement('div');
        card.className = 'shop-item ' + (giyiyorMu ? 'equipped' : '');

        let butonHtml = '';
        if (!sahipMi) {
          butonHtml = `<button class="shop-btn btn-buy" onclick="urunSatinAl('${urun.id}')">⭐ ${urun.fiyat} Satın Al</button>`;
        } else if (giyiyorMu) {
          butonHtml = `<button class="shop-btn btn-unequip" onclick="urunCikar('${urun.kategori}')">✓ Giydirildi (Çıkar)</button>`;
        } else {
          butonHtml = `<button class="shop-btn btn-equip" onclick="urunGiydir('${urun.id}', '${urun.kategori}')">👕 Giydir</button>`;
        }

        card.innerHTML = `
          <div>
            <div class="shop-icon">${urun.icon}</div>
            <div class="shop-name">${urun.ad}</div>
            <div class="shop-price">${sahipMi ? 'Dolabında ✨' : urun.fiyat + ' Yıldız ⭐'}</div>
          </div>
          ${butonHtml}
        `;
        grid.appendChild(card);
      });
    }

    function urunSatinAl(id) {
      const urun = aksesuarlar.find(x => x.id === id);
      if (!urun) return;

      const mevcutYildiz = getYildizSayisi();
      if (mevcutYildiz < urun.fiyat) {
        document.getElementById('jojupof-speech').innerText = `"Yıldızımız yetmiyor (${mevcutYildiz} ⭐). Masal okuyup oyun oynayalım! 🎮"`;
        alert(`Bu eşya ${urun.fiyat} ⭐! Senin şu an ${mevcutYildiz} ⭐ yıldızın var.`);
        return;
      }

      // Önce toplam XP'yi koru, sonra cüzdandan yıldızı düş
      getToplamXp();
      yildizHarca(urun.fiyat);

      const env = getEnvanter();
      if (!env.includes(urun.id)) {
        env.push(urun.id);
        setEnvanter(env);
      }

      urunGiydir(urun.id, urun.kategori);
      animasyonYap('🎉');
      document.getElementById('jojupof-speech').innerText = `"Yaşasın! ${urun.ad} bana çok yakıştı! 🥰"`;
    }

    function urunGiydir(id, kategori) {
      const giyilen = getGiyilenler();
      giyilen[kategori] = id;
      setGiyilenler(giyilen);
      jojupofCiz();
      magazaCiz();
      animasyonYap('✨');
    }

    function urunCikar(kategori) {
      const giyilen = getGiyilenler();
      giyilen[kategori] = null;
      setGiyilenler(giyilen);
      jojupofCiz();
      magazaCiz();
    }

    function jojupofSev() {
      animasyonYap('❤️');
      document.getElementById('jojupof-speech').innerText = '"Seni çok seviyorum! İyi ki benim arkadaşımsın! 🥰"';
    }

    // Karpuz vererek de günde birkaç kez ekstra büyüme puanı (XP) kazanabilsin!
    function jojupofBesle() {
      animasyonYap('🍉');
      xpArtir(1);
      seciliEvrimSeviyesi = null; // Yeni seviye açıldıysa otomatik geçsin
      jojupofCiz();
      document.getElementById('jojupof-speech').innerText = '"Ham hum! Karpuz çok lezzetliydi, +1 Büyüme Puanı (XP) kazandım! 🍉😋"';
    }

    function animasyonYap(emoji) {
      const stage = document.getElementById('pet-stage-area');
      const avatar = document.getElementById('pet-avatar-wrapper');
      avatar.classList.remove('bounce');
      void avatar.offsetWidth;
      avatar.classList.add('bounce');

      const fly = document.createElement('div');
      fly.className = 'floating-effect';
      fly.innerText = emoji;
      fly.style.left = (Math.random() * 50 + 25) + '%';
      fly.style.top = '35%';
      stage.appendChild(fly);
      setTimeout(() => fly.remove(), 900);
    }

    document.addEventListener('DOMContentLoaded', () => {
      yildizEkraniGuncelle();
      jojupofCiz();
      magazaCiz();
    });
  </script>
</body>
</html>
