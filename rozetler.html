<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jojupof &amp; Başarılarım | Masal &amp; Zeka</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Jojupof Sanal Bebek Alanı */
    .pet-card {
      background: linear-gradient(180deg, #ffffff 0%, #fff7ed 100%);
      border-radius: 28px;
      padding: 22px 16px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(234, 88, 12, 0.12);
      border: 4px solid #fed7aa;
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .pet-badge-level {
      display: inline-block;
      background: #f97316;
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      padding: 5px 14px;
      border-radius: 16px;
      margin-bottom: 6px;
      box-shadow: 0 3px 0 #c2410c;
    }

    .pet-name {
      font-size: 26px;
      font-weight: 900;
      color: #7c2d12;
      margin-bottom: 2px;
    }

    .pet-title {
      font-size: 14px;
      font-weight: 800;
      color: #ea580c;
      margin-bottom: 12px;
    }

    /* Karakter Sahnesi */
    .pet-stage {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 12px auto;
      background: radial-gradient(circle, #ffedd5 40%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .pet-svg-container {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 8px 12px rgba(124, 45, 18, 0.15));
      animation: floatPet 3s ease-in-out infinite;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pet-svg-container svg {
      width: 100%;
      height: 100%;
    }

    @keyframes floatPet {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .pet-svg-container.bounce {
      animation: bouncePet 0.5s ease-in-out;
    }

    @keyframes bouncePet {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.22) rotate(-4deg); }
    }

    /* Uçuşan Kalp & Karpuz Efekti */
    .floating-effect {
      position: absolute;
      font-size: 30px;
      pointer-events: none;
      animation: flyUp 0.9s forwards ease-out;
      z-index: 10;
    }

    @keyframes flyUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.4); }
    }

    /* XP Büyüme Barı */
    .xp-container {
      background: #f1f5f9;
      border: 3px solid #e2e8f0;
      border-radius: 20px;
      height: 24px;
      width: 90%;
      margin: 0 auto 8px auto;
      overflow: hidden;
      position: relative;
    }

    .xp-fill {
      background: linear-gradient(90deg, #f59e0b, #10b981);
      height: 100%;
      width: 20%;
      border-radius: 16px;
      transition: width 0.4s ease;
    }

    .xp-text {
      font-size: 13px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 14px;
    }

    /* Butonlar: Sev & Besle */
    .pet-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .pet-btn {
      flex: 1;
      max-width: 150px;
      padding: 10px 14px;
      border-radius: 18px;
      border: none;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-love {
      background: #ec4899;
      color: #ffffff;
      box-shadow: 0 4px 0 #be185d;
    }
    .btn-love:active { transform: translateY(2px); box-shadow: 0 2px 0 #be185d; }

    .btn-feed {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 4px 0 #047857;
    }
    .btn-feed:active { transform: translateY(2px); box-shadow: 0 2px 0 #047857; }

    /* Rozet Listesi */
    .badges-section-title {
      font-size: 20px;
      font-weight: 900;
      color: #0f172a;
      margin: 20px 6px 12px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-card {
      background: #ffffff;
      border-radius: 22px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.05);
      border: 3px solid #ffffff;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .badge-card.locked {
      opacity: 0.55;
      filter: grayscale(0.8);
      background: #f8fafc;
    }

    .badge-icon {
      font-size: 38px;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fef08a;
      flex-shrink: 0;
    }

    .badge-info h3 { font-size: 16px; font-weight: 900; color: #0f172a; margin-bottom: 2px; }
    .badge-info p { font-size: 12px; font-weight: 700; color: #64748b; }
    .badge-status { margin-left: auto; font-size: 20px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Üst Bar -->
    <header class="app-top-bar">
      <a href="index.html" class="app-brand">
        <span style="font-size:24px;">🐾</span>
        <span class="app-logo-text">Jojupof &amp; Ben</span>
      </a>
      <div class="star-counter-badge">
        <span>⭐</span>
        <span id="user-stars-count">0</span>
      </div>
    </header>

    <!-- SANAL BEBEK: JOJUPOF KARTI -->
    <section class="pet-card">
      <div class="pet-badge-level" id="pet-level-badge">Seviye 1</div>
      <h2 class="pet-name">Jojupof 🐾</h2>
      <p class="pet-title" id="pet-stage-title">Bebek Kapibara</p>

      <div class="pet-stage" id="pet-stage-area" onclick="jojupofSev()">
        <div class="pet-svg-container" id="pet-avatar-wrapper">
          <!-- Gerçek Kapibara SVG'si Buraya Basılır -->
        </div>
      </div>

      <!-- İlerleme (XP) -->
      <div class="xp-container">
        <div class="xp-fill" id="xp-progress-bar"></div>
      </div>
      <div class="xp-text" id="xp-status-text">0 / 6 Yıldız (Büyümeye 6 kaldı)</div>

      <!-- Etkileşim Butonları -->
      <div class="pet-actions">
        <button class="pet-btn btn-love" onclick="jojupofSev()">❤️ Sev</button>
        <button class="pet-btn btn-feed" onclick="jojupofBesle()">🍉 Karpuz Ver</button>
      </div>
    </section>

    <!-- ROZETLER VE KUPALAR -->
    <h3 class="badges-section-title">🏆 Başarı Rozetlerim</h3>
    <div id="rozetler-listesi"></div>

  </div>

  <!-- Sabit Alt Mobil Menü -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">📖</span>
      <span>Masallar</span>
    </a>
    <a href="tekerlemeler.html" class="nav-item">
      <span class="nav-icon">⚡</span>
      <span>Tekerleme</span>
    </a>
    <a href="oyunlar.html" class="nav-item">
      <span class="nav-icon">🧩</span>
      <span>Oyunlar</span>
    </a>
    <a href="rozetler.html" class="nav-item active">
      <span class="nav-icon">🏆</span>
      <span>Başarılarım</span>
    </a>
  </nav>

  <script src="app.js"></script>
  <script>
    /* SABİT VE HER CİHAZDA AYNI GÖRÜNEN GERÇEK KAPİBARA ÇİZİMLERİ (SVG) */
    const svgKoleksiyonu = {
      // 1. Seviye: Bebek Jojupof (Emzikli / Minik Kundaklı)
      bebek: `
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Kundak -->
          <circle cx="60" cy="65" r="44" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="4"/>
          <!-- Kapibara Gövde / Baş -->
          <rect x="36" y="32" width="48" height="42" rx="20" fill="#B45309"/>
          <!-- Kulaklar -->
          <circle cx="36" cy="36" r="7" fill="#78350F"/>
          <circle cx="84" cy="36" r="7" fill="#78350F"/>
          <circle cx="36" cy="36" r="4" fill="#FDE68A"/>
          <circle cx="84" cy="36" r="4" fill="#FDE68A"/>
          <!-- Gözler (Uykulu tatlı gözler) -->
          <circle cx="48" cy="48" r="3.5" fill="#1E293B"/>
          <circle cx="72" cy="48" r="3.5" fill="#1E293B"/>
          <!-- Pembe Yanaklar -->
          <circle cx="42" cy="56" r="5" fill="#F472B6" opacity="0.6"/>
          <circle cx="78" cy="56" r="5" fill="#F472B6" opacity="0.6"/>
          <!-- Burun -->
          <rect x="52" y="52" width="16" height="10" rx="5" fill="#78350F"/>
          <!-- Bebek Emziği -->
          <circle cx="60" cy="66" r="7" fill="#F59E0B"/>
          <circle cx="60" cy="66" r="4" fill="#FEF08A"/>
        </svg>
      `,

      // 2. Seviye: Klasik Sevimli Kapibara (Kafasında Mandalina / Portakal Olan)
      mandalinali: `
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Gövde -->
          <ellipse cx="60" cy="72" rx="44" ry="34" fill="#92400E"/>
          <!-- Kafa -->
          <rect x="35" y="35" width="50" height="45" rx="20" fill="#B45309"/>
          <!-- Kulaklar -->
          <ellipse cx="35" cy="40" rx="7" ry="9" fill="#78350F"/>
          <ellipse cx="85" cy="40" rx="7" ry="9" fill="#78350F"/>
          <!-- Kapibaranın meşhur sakin gözleri -->
          <line x1="45" y1="50" x2="53" y2="50" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="67" y1="50" x2="75" y2="50" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
          <!-- Pembe Yanaklar -->
          <circle cx="42" cy="58" r="5.5" fill="#F472B6" opacity="0.65"/>
          <circle cx="78" cy="58" r="5.5" fill="#F472B6" opacity="0.65"/>
          <!-- Burun ve Ağız -->
          <rect x="52" y="55" width="16" height="12" rx="6" fill="#78350F"/>
          <line x1="60" y1="67" x2="60" y2="72" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Mandalina / Portakal (Kafasında) -->
          <circle cx="60" cy="28" r="10" fill="#EA580C"/>
          <circle cx="58" cy="26" r="2" fill="#FED7AA"/>
          <!-- Portakal Yaprağı -->
          <path d="M60 18 Q66 14 68 18 Q64 22 60 20" fill="#15803D"/>
        </svg>
      `,

      // 3. Seviye: Bilge Kral Jojupof (Altın Taçlı & Pelerinli)
      kral: `
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Kırmızı Pelerin -->
          <path d="M25 85 Q60 105 95 85 L90 105 Q60 115 30 105 Z" fill="#DC2626"/>
          <!-- Gövde -->
          <ellipse cx="60" cy="72" rx="44" ry="34" fill="#92400E"/>
          <!-- Kafa -->
          <rect x="35" y="35" width="50" height="45" rx="20" fill="#B45309"/>
          <!-- Kulaklar -->
          <ellipse cx="35" cy="40" rx="7" ry="9" fill="#78350F"/>
          <ellipse cx="85" cy="40" rx="7" ry="9" fill="#78350F"/>
          <!-- Bilge Gözler -->
          <circle cx="48" cy="50" r="3.5" fill="#1E293B"/>
          <circle cx="72" cy="50" r="3.5" fill="#1E293B"/>
          <!-- Burun -->
          <rect x="52" y="55" width="16" height="12" rx="6" fill="#78350F"/>
          <!-- Altın Taç -->
          <path d="M42 32 L46 18 L53 26 L60 15 L67 26 L74 18 L78 32 Z" fill="#FACC15" stroke="#EAB308" stroke-width="2"/>
          <circle cx="60" cy="20" r="2.5" fill="#EF4444"/>
          <circle cx="47" cy="22" r="2" fill="#3B82F6"/>
          <circle cx="73" cy="22" r="2" fill="#3B82F6"/>
        </svg>
      `,

      // 4. Seviye: Sihirli Ejderha Jojupof (Kanatlı & Boynuzlu)
      ejderha: `
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Ejderha Kanatları -->
          <path d="M28 55 Q5 40 12 70 Q24 75 32 68 Z" fill="#10B981" stroke="#047857" stroke-width="2"/>
          <path d="M92 55 Q115 40 108 70 Q96 75 88 68 Z" fill="#10B981" stroke="#047857" stroke-width="2"/>
          <!-- Gövde -->
          <ellipse cx="60" cy="72" rx="44" ry="34" fill="#92400E"/>
          <!-- Kafa -->
          <rect x="35" y="35" width="50" height="45" rx="20" fill="#B45309"/>
          <!-- Ejderha Minik Boynuzları -->
          <path d="M42 35 Q40 22 45 20 Q48 25 46 35 Z" fill="#F59E0B"/>
          <path d="M78 35 Q80 22 75 20 Q72 25 74 35 Z" fill="#F59E0B"/>
          <!-- Kulaklar -->
          <ellipse cx="35" cy="40" rx="7" ry="9" fill="#78350F"/>
          <ellipse cx="85" cy="40" rx="7" ry="9" fill="#78350F"/>
          <!-- Gülen Gözler -->
          <path d="M44 50 Q48 45 52 50" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
          <path d="M68 50 Q72 45 76 50" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
          <!-- Pembe Yanaklar -->
          <circle cx="42" cy="58" r="5.5" fill="#F472B6" opacity="0.65"/>
          <circle cx="78" cy="58" r="5.5" fill="#F472B6" opacity="0.65"/>
          <!-- Burun -->
          <rect x="52" y="55" width="16" height="12" rx="6" fill="#78350F"/>
        </svg>
      `
    };

    /* JOJUPOF'UN EVRİM TABLOSU */
    const evrimler = [
      {
        seviye: 1,
        baslik: "Bebek Jojupof 🍼",
        svg: svgKoleksiyonu.bebek,
        minYildiz: 0,
        hedefYildiz: 6
      },
      {
        seviye: 2,
        baslik: "Neşeli Kapibara Jojupof 🍊",
        svg: svgKoleksiyonu.mandalinali,
        minYildiz: 6,
        hedefYildiz: 16
      },
      {
        seviye: 3,
        baslik: "Bilge Kral Jojupof 👑",
        svg: svgKoleksiyonu.kral,
        minYildiz: 16,
        hedefYildiz: 30
      },
      {
        seviye: 4,
        baslik: "Sihirli Ejder-Kapibara 🐲",
        svg: svgKoleksiyonu.ejderha,
        minYildiz: 30,
        hedefYildiz: 50
      }
    ];

    // Rozet Havuzu
    const tumRozetler = [
      { id: "ilk_adim", ad: "İlk Adım Rozeti", desc: "İlk masalını tamamladın!", icon: "🌱", minOkunan: 1, minYildiz: 0 },
      { id: "kapibara_dostu", ad: "Jojupof'un En Yakın Arkadaşı", desc: "Jojupof'u 2. seviyeye ulaştırdın!", icon: "🍉", minOkunan: 0, minYildiz: 6 },
      { id: "kitap_kurdu", ad: "Küçük Kitap Kurdu", desc: "En az 3 masal okudun!", icon: "🐛", minOkunan: 3, minYildiz: 0 },
      { id: "yildiz_avcisi", ad: "Yıldız Avcısı", desc: "Toplam 16 yıldız topladın!", icon: "⭐", minOkunan: 0, minYildiz: 16 },
      { id: "ejderha_ustasi", ad: "Efsanevi Ejderha Ustası", desc: "Jojupof'u ejderhaya dönüştürdün!", icon: "🐲", minOkunan: 0, minYildiz: 30 }
    ];

    function jojupofGuncelle() {
      const yildiz = getYildizSayisi();
      
      let suAnki = evrimler[0];
      let sonraki = evrimler[1];

      for (let i = 0; i < evrimler.length; i++) {
        if (yildiz >= evrimler[i].minYildiz) {
          suAnki = evrimler[i];
          sonraki = evrimler[i + 1] || null;
        }
      }

      document.getElementById('pet-level-badge').innerText = `Seviye ${suAnki.seviye}`;
      document.getElementById('pet-stage-title').innerText = suAnki.baslik;
      document.getElementById('pet-avatar-wrapper').innerHTML = suAnki.svg;

      if (sonraki) {
        const aralik = sonraki.minYildiz - suAnki.minYildiz;
        const ilerleme = yildiz - suAnki.minYildiz;
        const yuzde = Math.min(100, Math.max(10, Math.round((ilerleme / aralik) * 100)));
        document.getElementById('xp-progress-bar').style.width = yuzde + '%';
        const kalan = sonraki.minYildiz - yildiz;
        document.getElementById('xp-status-text').innerText = `${yildiz} / ${sonraki.minYildiz} Yıldız (Büyümeye ${kalan} kaldı!)`;
      } else {
        document.getElementById('xp-progress-bar').style.width = '100%';
        document.getElementById('xp-status-text').innerText = `Tebrikler! Jojupof en üst seviyeye ulaştı! 🎉 (${yildiz} Yıldız)`;
      }
    }

    function jojupofSev() {
      animasyonYap('❤️');
    }

    function jojupofBesle() {
      animasyonYap('🍉');
    }

    function animasyonYap(emoji) {
      const stage = document.getElementById('pet-stage-area');
      const avatar = document.getElementById('pet-avatar-wrapper');
      
      avatar.classList.remove('bounce');
      void avatar.offsetWidth;
      avatar.classList.add('bounce');

      const fly = document.createElement('div');
      fly.className = 'floating-effect';
      fly.innerText = emoji;
      fly.style.left = (Math.random() * 50 + 25) + '%';
      fly.style.top = '35%';
      stage.appendChild(fly);

      setTimeout(() => fly.remove(), 900);
    }

    function renderRozetler() {
      const container = document.getElementById('rozetler-listesi');
      container.innerHTML = '';
      const okunanSayisi = getOkunanMasallar().length;
      const yildizSayisi = getYildizSayisi();

      tumRozetler.forEach(r => {
        const kazanildi = (okunanSayisi >= r.minOkunan) && (yildizSayisi >= r.minYildiz);
        const card = document.createElement('div');
        card.className = 'badge-card ' + (kazanildi ? '' : 'locked');
        card.innerHTML = `
          <div class="badge-icon">${r.icon}</div>
          <div class="badge-info">
            <h3>${r.ad}</h3>
            <p>${r.desc}</p>
          </div>
          <div class="badge-status">${kazanildi ? '✅' : '🔒'}</div>
        `;
        container.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      jojupofGuncelle();
      renderRozetler();
    });
  </script>
</body>
</html>
